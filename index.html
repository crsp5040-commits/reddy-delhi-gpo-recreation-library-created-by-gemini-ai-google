                    ];
                    csvRows.push(row.join(","));
                });

                const csvString = csvRows.join("\n");
                const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `Delhi_GPO_Books_Catalog_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();

                showToast("Books catalog exported to CSV file successfully!", "success");

            const handleDownloadCSVTemplate = () => {
                const headers = ["accession_no", "book_no", "title", "author", "category", "medium", "status", "rack_no"];
                const sampleRow = ["35", "35", "Sample Postal History Book", "R. K. Sharma", "History", "English", "Available", "R-18"];
                const csvContent = headers.join(",") + "\n" + sampleRow.join(",");
                const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "Delhi_GPO_Books_Import_Template.csv";
                a.click();
                URL.revokeObjectURL(url);
                showToast("CSV Template downloaded!", "success");
            };

            const handleCSVFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setCsvFileName(file.name);
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const text = evt.target.result;
                    parseCSVContent(text);
                };
                reader.readAsText(file);
            };

            const parseCSVContent = (text) => {
                const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
                if (lines.length < 2) {
                    showToast("CSV file is empty or missing data rows.", "error");
                    return;
                }

                const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
                const accIdx = headers.indexOf('accession_no');
                const titleIdx = headers.indexOf('title');
                const authorIdx = headers.indexOf('author');

                if (accIdx === -1 || titleIdx === -1 || authorIdx === -1) {
                    setCsvImportErrors(["CSV must contain at least 'accession_no', 'title', and 'author' columns."]);
                    setCsvParsedRows([]);
                    return;
                }

                const bNoIdx = headers.indexOf('book_no');
                const catIdx = headers.indexOf('category');
                const medIdx = headers.indexOf('medium');
                const statIdx = headers.indexOf('status');
                const rackIdx = headers.indexOf('rack_no');

                const parsed = [];
                const errors = [];
                const seenAccs = new Set();

                for (let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"|"$/g, ''));
                    const accNo = cols[accIdx] || '';
                    const title = cols[titleIdx] || '';
                    const author = cols[authorIdx] || '';

                    if (!accNo || !title || !author) {
                        errors.push(`Row ${i + 1}: Missing required accession_no, title, or author.`);
                        continue;
                    }

                    if (seenAccs.has(accNo.toLowerCase())) {
                        errors.push(`Row ${i + 1}: Duplicate accession_no "${accNo}" within CSV.`);
                        continue;
                    }

                    const catalogExists = books.some(b => b.accession_no.toString().toLowerCase() === accNo.toLowerCase());
                    if (catalogExists) {
                        errors.push(`Row ${i + 1}: Accession_no "${accNo}" already exists in library catalog. Duplicate rejected.`);
                        continue;
                    }

                    seenAccs.add(accNo.toLowerCase());

                    parsed.push({
                        accession_no: accNo,
                        book_no: bNoIdx !== -1 && cols[bNoIdx] ? cols[bNoIdx] : accNo,
                        title: title,
                        author: author,
                        category: catIdx !== -1 && cols[catIdx] ? cols[catIdx] : 'Literature',
                        medium: medIdx !== -1 && cols[medIdx] ? cols[medIdx] : 'English',
                        status: statIdx !== -1 && cols[statIdx] ? cols[statIdx] : 'Available',
                        rack_no: rackIdx !== -1 && cols[rackIdx] ? cols[rackIdx] : 'R-1'
                    });
                }

                setCsvImportErrors(errors);
                setCsvParsedRows(parsed);
            };

                                <form onSubmit={handleSaveGovMember} className="space-y-3 text-xs sm:text-sm font-medium">
                                    <div>
                                        <label className="block mb-1 font-bold">Sl. No.</label>
                                        <input type="number" value={govFormData.sno} onChange={(e) => setGovFormData({ ...govFormData, sno: e.target.value })} className="w-full p-2.5 rounded-xl border dark:bg-slate-950" />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Full Name *</label>
                                        <input type="text" value={govFormData.name} onChange={(e) => setGovFormData({ ...govFormData, name: e.target.value })} placeholder="e.g. Sh. Ram Kumar" className="w-full p-2.5 rounded-xl border dark:bg-slate-950" required />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Designation *</label>
                                        <input type="text" value={govFormData.desig} onChange={(e) => setGovFormData({ ...govFormData, desig: e.target.value })} placeholder="e.g. PA, APM, MTS" className="w-full p-2.5 rounded-xl border dark:bg-slate-950" required />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Club Role *</label>
                                        <select value={govFormData.role} onChange={(e) => setGovFormData({ ...govFormData, role: e.target.value })} className="w-full p-2.5 rounded-xl border dark:bg-slate-950" required>
                                            <option value="President">President</option>
                                            <option value="Vice President">Vice President</option>
                                            <option value="Secretary">Secretary</option>
                                            <option value="Assistant Secretary">Assistant Secretary</option>
                                            <option value="Treasurer">Treasurer</option>
                                            <option value="Assistant Treasurer">Assistant Treasurer</option>
                                            <option value="Auditor">Auditor</option>
                                            <option value="Librarian">Librarian</option>
                                            <option value="Member">Member</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow transition-all cursor-pointer text-sm">Save Committee Member</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Governing Body Delete Confirmation */}
                    {showGovDeleteConfirm && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2200] flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-red-500 text-center space-y-4">
                                <i className="fa-solid fa-triangle-exclamation text-red-500 text-4xl"></i>
                                <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">Remove Committee Member</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Are you sure you want to remove "{showGovDeleteConfirm.name}" from the Governing Body list?</p>
                                <div className="flex space-x-2 pt-2">
                                    <button onClick={handleDeleteGovMemberConfirm} className="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow text-xs cursor-pointer">Yes, Remove</button>
                                    <button onClick={() => setShowGovDeleteConfirm(null)} className="flex-1 py-2 bg-slate-200 dark:bg-slate-800 font-bold rounded-xl shadow text-xs cursor-pointer">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add/Edit Social Channel Modal */}
                    {showSocialModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2200] flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-amber-400 relative mobile-modal-scroll">
                                <button onClick={() => setShowSocialModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors cursor-pointer text-xl">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                                <h3 className="font-cinzel font-black text-lg text-sky-950 dark:text-amber-300 mb-3">{editingSocial ? 'Edit Social Channel' : 'Add Social Channel'}</h3>
                                <form onSubmit={handleSaveSocialChannel} className="space-y-3 text-xs sm:text-sm font-medium">
                                    <div>
                                        <label className="block mb-1 font-bold">Channel Name *</label>
                                        <input type="text" value={socialFormData.name} onChange={(e) => setSocialFormData({ ...socialFormData, name: e.target.value })} placeholder="e.g. WhatsApp Channel" className="w-full p-2.5 rounded-xl border dark:bg-slate-950" required />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Handle / Display Text</label>
                                        <input type="text" value={socialFormData.handle} onChange={(e) => setSocialFormData({ ...socialFormData, handle: e.target.value })} placeholder="e.g. @delhigpo110006" className="w-full p-2.5 rounded-xl border dark:bg-slate-950" />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Channel URL *</label>
                                        <input type="text" value={socialFormData.url} onChange={(e) => setSocialFormData({ ...socialFormData, url: e.target.value })} placeholder="https://..." className="w-full p-2.5 rounded-xl border dark:bg-slate-950 font-mono text-[11px]" required />
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block mb-1 font-bold">Font Awesome Icon Class</label>
                                            <input type="text" value={socialFormData.icon} onChange={(e) => setSocialFormData({ ...socialFormData, icon: e.target.value })} placeholder="fa-whatsapp" className="w-full p-2.5 rounded-xl border dark:bg-slate-950 font-mono text-[11px]" />
                                        </div>
                                        <div>
                                            <label className="block mb-1 font-bold">Tailwind Color Classes</label>
                                            <input type="text" value={socialFormData.color} onChange={(e) => setSocialFormData({ ...socialFormData, color: e.target.value })} placeholder="bg-emerald-600 text-white" className="w-full p-2.5 rounded-xl border dark:bg-slate-950 font-mono text-[11px]" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow transition-all cursor-pointer text-sm">Save Social Channel</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Social Channel Delete Confirmation */}
                    {showSocialDeleteConfirm && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2200] flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-red-500 text-center space-y-4">
                                <i className="fa-solid fa-triangle-exclamation text-red-500 text-4xl"></i>
                                <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">Delete Social Channel</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Are you sure you want to delete "{showSocialDeleteConfirm.name}"?</p>
                                <div className="flex space-x-2 pt-2">
                                    <button onClick={handleDeleteSocialChannelConfirm} className="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow text-xs cursor-pointer">Yes, Delete</button>
                                    <button onClick={() => setShowSocialDeleteConfirm(null)} className="flex-1 py-2 bg-slate-200 dark:bg-slate-800 font-bold rounded-xl shadow text-xs cursor-pointer">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add/Edit Holiday Modal */}
                    {showHolidayModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2200] flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-amber-400 relative mobile-modal-scroll">
                                <button onClick={() => setShowHolidayModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors cursor-pointer text-xl">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                                <h3 className="font-cinzel font-black text-lg text-sky-950 dark:text-amber-300 mb-3">{editingHoliday ? 'Edit Holiday' : 'Add New Holiday'}</h3>
                                <form onSubmit={handleSaveHoliday} className="space-y-3 text-xs sm:text-sm font-medium">
                                    <div>
                                        <label className="block mb-1 font-bold">Holiday Name *</label>
                                        <input type="text" value={holidayFormData.holiday_name} onChange={(e) => setHolidayFormData({ ...holidayFormData, holiday_name: e.target.value })} placeholder="e.g. Republic Day" className="w-full p-2.5 rounded-xl border dark:bg-slate-950" required />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Date (DD-Mon format) *</label>
                                        <input type="text" value={holidayFormData.holiday_date} onChange={(e) => setHolidayFormData({ ...holidayFormData, holiday_date: e.target.value })} placeholder="e.g. 26-Jan" className="w-full p-2.5 rounded-xl border dark:bg-slate-950 font-mono" required />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Wish Message (shown in ticker)</label>
                                        <textarea value={holidayFormData.wish_message} onChange={(e) => setHolidayFormData({ ...holidayFormData, wish_message: e.target.value })} placeholder="🎉 Happy Republic Day! Library remains closed today." className="w-full p-2.5 rounded-xl border dark:bg-slate-950" rows="2"></textarea>
                                    </div>
                                    <label className="flex items-center space-x-2 cursor-pointer">
                                        <input type="checkbox" checked={holidayFormData.is_active} onChange={(e) => setHolidayFormData({ ...holidayFormData, is_active: e.target.checked })} className="w-4 h-4" />
                                        <span className="font-bold">Active (library closed on this date)</span>
                                    </label>
                                    <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow transition-all cursor-pointer text-sm">Save Holiday</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Holiday Delete Confirmation */}
                    {showHolidayDeleteConfirm && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2200] flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-red-500 text-center space-y-4">
                                <i className="fa-solid fa-triangle-exclamation text-red-500 text-4xl"></i>
                                <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">Delete Holiday</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Are you sure you want to delete "{showHolidayDeleteConfirm.holiday_name}"?</p>
                                <div className="flex space-x-2 pt-2">
                                    <button onClick={handleDeleteHolidayConfirm} className="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow text-xs cursor-pointer">Yes, Delete</button>
                                    <button onClick={() => setShowHolidayDeleteConfirm(null)} className="flex-1 py-2 bg-slate-200 dark:bg-slate-800 font-bold rounded-xl shadow text-xs cursor-pointer">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Broadcast Notification Modal */}
                    {showNotifModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2200] flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-amber-400 relative mobile-modal-scroll">
                                <button onClick={() => setShowNotifModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors cursor-pointer text-xl">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                                <h3 className="font-cinzel font-black text-lg text-sky-950 dark:text-amber-300 mb-3">Broadcast New Notification</h3>
                                <form onSubmit={handleCreateNotification} className="space-y-3 text-xs sm:text-sm font-medium">
                                    <div>
                                        <label className="block mb-1 font-bold">Title *</label>
                                        <input type="text" value={notifFormData.title} onChange={(e) => setNotifFormData({ ...notifFormData, title: e.target.value })} placeholder="e.g. New Books Added!" className="w-full p-2.5 rounded-xl border dark:bg-slate-950" required />
                                    </div>
                                    <div>
                                        <label className="block mb-1 font-bold">Message *</label>
                                        <textarea value={notifFormData.message} onChange={(e) => setNotifFormData({ ...notifFormData, message: e.target.value })} placeholder="Write your announcement..." className="w-full p-2.5 rounded-xl border dark:bg-slate-950" rows="3" required></textarea>
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl shadow transition-all cursor-pointer text-sm">Broadcast to All Members</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Notification Delete Confirmation */}
                    {showNotifDeleteConfirm && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2200] flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-red-500 text-center space-y-4">
                                <i className="fa-solid fa-triangle-exclamation text-red-500 text-4xl"></i>
                                <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">Delete Notification</h3>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Are you sure you want to delete "{showNotifDeleteConfirm.title}"?</p>
                                <div className="flex space-x-2 pt-2">
                                    <button onClick={handleDeleteNotificationConfirm} className="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow text-xs cursor-pointer">Yes, Delete</button>
                                    <button onClick={() => setShowNotifDeleteConfirm(null)} className="flex-1 py-2 bg-slate-200 dark:bg-slate-800 font-bold rounded-xl shadow text-xs cursor-pointer">Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<MainApp />);
        } catch(e) {
            console.error("Render error:", e);
        }
    </script>
</body>
</html>
