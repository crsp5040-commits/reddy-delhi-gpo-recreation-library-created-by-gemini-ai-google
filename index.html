                viewGrid: "கட்டம் பார்வை",
                viewTable: "அட்டவணை பார்வை",
                showingVolumes: "காண்பிக்கப்படுகிறது",
                ofVolumes: "மொத்தம்",
                volumesText: "புத்தகங்கள்",
                perPageText: "(பக்கத்திற்கு 15 புத்தகங்கள்)",
                prevPage: "முந்தைய",
                nextPage: "அடுத்தது",
                pageText: "பக்கம்",
                notifTitle: "அறிவிப்புகள்",
                notifAll: "அனைத்து புதுப்பிப்புகள்",
                notifBooks: "புதிய புத்தகங்கள்",
                notifAnnouncements: "அறிவிப்புகள்",
                notifClear: "அனைத்தையும் படித்ததாகக் குறிக்கவும்",
                noNotifMsg: "தற்போது புதிய அறிவிப்புகள் எதுவும் இல்லை."
            }
        };

        function MainApp() {
            const [lang, setLang] = useState('EN');
            const [showLangDropdown, setShowLangDropdown] = useState(false);
            const [darkMode, setDarkMode] = useState(() => {
                return safeStorage.getItem('gpo_library_theme') === 'dark';
            });

            // Dynamic Site Text & Content State
            const [siteContent, setSiteContent] = useState(() => {
                const saved = safeStorage.getItem('gpo_library_site_content');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return DEFAULT_SITE_CONTENT;
            });

            // Toast Notifications State
            const [toast, setToast] = useState(null);

            const showToast = useCallback((message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            }, []);

            // Catalog Data
            const [books, setBooks] = useState(() => {
                const saved = safeStorage.getItem('gpo_library_books');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return INITIAL_BOOKS;
            });

            // Requisitions List
            const [requisitions, setRequisitions] = useState(() => {
                const saved = safeStorage.getItem('gpo_library_reqs');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [];
            });

            // Librarian Notices List
            const [notices, setNotices] = useState(() => {
                const saved = safeStorage.getItem('gpo_library_notices');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [
                    {
                        id: 1,
                        title: "Annual Stock Verification & Circulation Notice",
                        content: "All members holding books for more than 30 days are kindly requested to renew or return them promptly.",
                        date: new Date().toLocaleDateString(),
                        priority: "HIGH"
                    }
                ];
            });

            // USER NOTIFICATION CENTER STATE
            const [notifications, setNotifications] = useState(() => {
                const saved = safeStorage.getItem('gpo_library_notifications');
                if (saved) {
                    try { return JSON.parse(saved); } catch(e) {}
                }
                return [
                    {
                        id: 1,
                        title: "Welcome to Delhi GPO Library System",
                        content: "Explore 34 registered volumes, request book issues, and track library announcements.",
                        type: "NOTICE",
                        date: new Date().toLocaleDateString(),
                        unread: true
                    }
                ];
            });
            const [showNotifModal, setShowNotifModal] = useState(false);
            const [notifFilter, setNotifFilter] = useState('ALL');

            const unreadNotifCount = useMemo(() => {
                return notifications.filter(n => n.unread).length;
            }, [notifications]);

            const [activeView, setActiveView] = useState('HOME');
            const [viewMode, setViewMode] = useState('GRID');
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('ALL');
            const [mediumFilter, setMediumFilter] = useState('ALL');
            const [sortOption, setSortOption] = useState('SERIAL_ASC');
            const [currentPage, setCurrentPage] = useState(1);

            // AUTO RESET CURRENT PAGE TO 1 WHEN SEARCH OR FILTERS CHANGE
            useEffect(() => {
                setCurrentPage(1);
            }, [searchTerm, categoryFilter, mediumFilter, activeView]);

            // Notice Board Modal State
            const [showNoticeModal, setShowNoticeModal] = useState(false);
            const [newNoticeForm, setNewNoticeForm] = useState({
                title: '',
                content: '',
                priority: 'NORMAL'
            });

            // Requisition Form state
            const [reqForm, setReqForm] = useState({
                bookId: '',
                empName: '',
                empId: '',
                cadre: '',
                branch: '',
                mobile: '',
                email: ''
            });

            // Admin Authentication
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [showAdminPassword, setShowAdminPassword] = useState(false);
            const [loginError, setLoginError] = useState('');

            // Rejection Modal
            const [showRejectModal, setShowRejectModal] = useState(null);
            const [rejectReason, setRejectReason] = useState('');

            // Add Book Form
            const [newBookForm, setNewBookForm] = useState({
                title: '',
                author: '',
                category: 'Self Help',
                medium: 'English'
            });

            // Hero Banner Image State
            const [heroImage, setHeroImage] = useState(() => {
                return safeStorage.getItem('gpo_library_hero_img') || DEFAULT_HERO_IMG;
            });
            const [heroUrlInput, setHeroUrlInput] = useState('');

            // Desk Section Background Image State
            const [deskImage, setDeskImage] = useState(() => {
                return safeStorage.getItem('gpo_library_desk_img') || DEFAULT_DESK_IMG;
            });
            const [deskUrlInput, setDeskUrlInput] = useState('');

            // PWA / APK Download Link State
            const [apkUrl, setApkUrl] = useState(() => {
                return safeStorage.getItem('gpo_library_apk_url') || '';
            });
            const [apkUrlInput, setApkUrlInput] = useState('');

            // PWA Install state
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstallPopup, setShowInstallPopup] = useState(false);
            const [showInstallModal, setShowInstallModal] = useState(false);

            // Synchronize Storage Changes
            useEffect(() => {
                safeStorage.setItem('gpo_library_books', JSON.stringify(books));
            }, [books]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_reqs', JSON.stringify(requisitions));
            }, [requisitions]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_notices', JSON.stringify(notices));
            }, [notices]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_notifications', JSON.stringify(notifications));
            }, [notifications]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_hero_img', heroImage);
            }, [heroImage]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_desk_img', deskImage);
            }, [deskImage]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_apk_url', apkUrl);
            }, [apkUrl]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_site_content', JSON.stringify(siteContent));
            }, [siteContent]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_theme', darkMode ? 'dark' : 'light');
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // MULTI-TAB / REALTIME SYNC LISTENER
            useEffect(() => {
                const syncStorage = (e) => {
                    try {
                        if (e.key === 'gpo_library_books' && e.newValue) setBooks(JSON.parse(e.newValue));
                        if (e.key === 'gpo_library_reqs' && e.newValue) setRequisitions(JSON.parse(e.newValue));
                        if (e.key === 'gpo_library_notices' && e.newValue) setNotices(JSON.parse(e.newValue));
                        if (e.key === 'gpo_library_notifications' && e.newValue) setNotifications(JSON.parse(e.newValue));
                        if (e.key === 'gpo_library_hero_img' && e.newValue) setHeroImage(e.newValue);
                        if (e.key === 'gpo_library_desk_img' && e.newValue) setDeskImage(e.newValue);
                        if (e.key === 'gpo_library_apk_url' && e.newValue !== null) setApkUrl(e.newValue);
                        if (e.key === 'gpo_library_site_content' && e.newValue) setSiteContent(JSON.parse(e.newValue));
                    } catch(err) {
                        console.warn("Storage sync parse error:", err);
                    }
                };
                window.addEventListener('storage', syncStorage);
                return () => window.removeEventListener('storage', syncStorage);
            }, []);

            // PWA Installation prompt listener
            useEffect(() => {
                const handler = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                };
                window.addEventListener('beforeinstallprompt', handler);

                const isDismissed = safeSession.getItem('gpo_app_popup_dismissed');
                if (!isDismissed) {
                    const timer = setTimeout(() => {
                        setShowInstallPopup(true);
                    }, 1200);
                    return () => clearTimeout(timer);
                }

                return () => window.removeEventListener('beforeinstallprompt', handler);
            }, []);

            const t = (key) => TRANSLATIONS[lang]?.[key] || TRANSLATIONS['EN'][key] || key;

            const handlePostNotice = (e) => {
                e.preventDefault();
                const noticeObj = {
                    id: Date.now(),
                    title: newNoticeForm.title,
                    content: newNoticeForm.content,
                    date: new Date().toLocaleDateString(),
                    priority: newNoticeForm.priority
                };
                setNotices([noticeObj, ...notices]);

                const newNotif = {
                    id: Date.now() + 1,
                    title: `📢 Announcement: ${newNoticeForm.title}`,
                    content: newNoticeForm.content,
                    type: 'NOTICE',
                    date: new Date().toLocaleDateString(),
                    unread: true
                };
                setNotifications(prev => [newNotif, ...prev]);

                setNewNoticeForm({ title: '', content: '', priority: 'NORMAL' });
                showToast('Notice published and alert sent to users!', 'success');
            };

            const handleDeleteNotice = (noticeId) => {
                setNotices(notices.filter(n => n.id !== noticeId));
                showToast('Notice deleted successfully.', 'info');
            };

            const pendingRequestsCount = useMemo(() => {
                return requisitions.filter(r => r.status === 'Pending').length;
            }, [requisitions]);

            const filteredBooks = useMemo(() => {
                return books.filter(book => {
                    if (activeView === 'AVAIL_BOOKS' && book.status !== 'Available') return false;
                    if (activeView === 'ISSUED_BOOKS' && book.status !== 'Issued') return false;

                    const matchesSearch = book.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          book.author.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          book.id.toString().includes(searchTerm);
                    
                    const matchesCategory = categoryFilter === 'ALL' || book.category === categoryFilter;
                    const matchesMedium = mediumFilter === 'ALL' || book.medium === mediumFilter;

                    return matchesSearch && matchesCategory && matchesMedium;
                }).sort((a, b) => {
                    if (sortOption === 'SERIAL_ASC') return a.id - b.id;
                    if (sortOption === 'SERIAL_DESC') return b.id - a.id;
                    if (sortOption === 'A-Z') return a.title.localeCompare(b.title);
                    if (sortOption === 'Z-A') return b.title.localeCompare(a.title);
                    return 0;
                });
            }, [books, activeView, searchTerm, categoryFilter, mediumFilter, sortOption]);

            const pageSize = 15;
            const totalPages = Math.ceil(filteredBooks.length / pageSize) || 1;
            const paginatedBooks = useMemo(() => {
                const start = (currentPage - 1) * pageSize;
                return filteredBooks.slice(start, start + pageSize);
            }, [filteredBooks, currentPage]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'Crsp5040@') {
                    setIsAdminLoggedIn(true);
                    setShowAdminLogin(false);
                    setAdminPassword('');
                    setShowAdminPassword(false);
                    setLoginError('');
                    setActiveView('ADMIN_PANEL');
                    showToast('Authenticated successfully as Librarian Admin.', 'success');
                } else {
                    setLoginError('Invalid secret password.');
                }
            };

            const handleRequisitionSubmit = (e) => {
                e.preventDefault();
                const bookToReq = books.find(b => b.id === parseInt(reqForm.bookId));
                if (!bookToReq) return;

                const newReq = {
                    id: Date.now(),
                    bookId: bookToReq.id,
                    bookTitle: bookToReq.title,
                    empName: reqForm.empName,
                    empId: reqForm.empId,
                    cadre: reqForm.cadre,
                    branch: reqForm.branch,
                    mobile: reqForm.mobile,
                    email: reqForm.email,
                    reqDate: new Date().toLocaleDateString(),
                    status: 'Pending'
                };

                setRequisitions(prev => [newReq, ...prev]);

                const reqNotif = {
                    id: Date.now() + 1,
                    title: `📩 Requisition Submitted: Book #${bookToReq.id}`,
                    content: `Your request for "${bookToReq.title}" by ${reqForm.empName} (${reqForm.empId}) has been submitted and is pending librarian review.`,
                    type: 'NOTICE',
                    date: new Date().toLocaleDateString(),
                    unread: true
                };
                setNotifications(prev => [reqNotif, ...prev]);

                setReqForm({ bookId: '', empName: '', empId: '', cadre: '', branch: '', mobile: '', email: '' });
                showToast('Book requisition submitted successfully! Pending approval from librarian.', 'success');
                setActiveView('HOME');
            };

            const handleApproveReq = (req) => {
                const issueDateObj = new Date();
                const dueDateObj = new Date();
                dueDateObj.setDate(dueDateObj.getDate() + 15);

                setRequisitions(prev => prev.map(r => r.id === req.id ? {
                    ...r,
                    status: 'Approved',
                    issueDate: issueDateObj.toLocaleDateString(),
                    dueDate: dueDateObj.toLocaleDateString()
                } : r));

                setBooks(prev => prev.map(b => b.id === req.bookId ? {
                    ...b,
                    status: 'Issued',
                    issuedTo: req.empName,
                    issuedMobile: req.mobile,
                    issuedEmail: req.email,
                    issueDate: issueDateObj.toLocaleDateString(),
                    dueDate: dueDateObj.toLocaleDateString()
                } : b));

                const approveNotif = {
                    id: Date.now(),
                    title: `✅ Requisition Approved: Book #${req.bookId}`,
                    content: `Volume #${req.bookId} (${req.bookTitle}) is issued to ${req.empName}. Due Date: ${dueDateObj.toLocaleDateString()}`,
                    type: 'BOOK',
                    date: new Date().toLocaleDateString(),
                    unread: true
                };
                setNotifications(prev => [approveNotif, ...prev]);

                showToast(`Book #${req.bookId} approved and issued to ${req.empName} for 15 days.`, 'success');
            };

            const handleConfirmReject = () => {
                if (!showRejectModal) return;
                const req = showRejectModal;
                const reason = rejectReason || 'Book currently unavailable or under reference.';

                setRequisitions(prev => prev.map(r => r.id === req.id ? {
                    ...r,
                    status: 'Rejected',
                    rejectReason: reason
                } : r));

                const rejectNotif = {
                    id: Date.now(),
                    title: `❌ Requisition Rejected: Book #${req.bookId}`,
                    content: `Requisition for "${req.bookTitle}" was rejected by Librarian. Reason: ${reason}`,
                    type: 'NOTICE',
                    date: new Date().toLocaleDateString(),
                    unread: true
                };
                setNotifications(prev => [rejectNotif, ...prev]);

                setShowRejectModal(null);
                setRejectReason('');
                showToast(`Requisition for Book #${req.bookId} rejected.`, 'info');
            };

            const handleReturnBook = (bookId) => {
                const book = books.find(b => b.id === bookId);
                setBooks(prev => prev.map(b => b.id === bookId ? {
                    ...b,
                    status: 'Available',
                    issuedTo: null,
                    issuedMobile: null,
                    issuedEmail: null,
                    issueDate: null,
                    dueDate: null
                } : b));

                if (book) {
                    const returnNotif = {
                        id: Date.now(),
                        title: `🔄 Book Returned: Volume #${bookId}`,
                        content: `"${book.title}" has been returned to the library and is now available for borrowing.`,
                        type: 'BOOK',
                        date: new Date().toLocaleDateString(),
                        unread: true
                    };
                    setNotifications(prev => [returnNotif, ...prev]);
                }

                showToast(`Book #${bookId} marked as returned and available.`, 'success');
            };

            const handleExtendBook = (bookId) => {
                let newDueDateStr = '';
                let bookTitle = '';
                setBooks(prev => prev.map(b => {
                    if (b.id === bookId && b.dueDate) {
                        const currentDue = new Date(b.dueDate);
                        currentDue.setDate(currentDue.getDate() + 15);
                        newDueDateStr = currentDue.toLocaleDateString();
                        bookTitle = b.title;
                        return { ...b, dueDate: newDueDateStr };
                    }
                    return b;
                }));

                const extendNotif = {
                    id: Date.now(),
                    title: `📅 Loan Extended: Book #${bookId}`,
                    content: `Loan period for "${bookTitle}" extended by +15 days. New Due Date: ${newDueDateStr}`,
                    type: 'BOOK',
                    date: new Date().toLocaleDateString(),
                    unread: true
                };
                setNotifications(prev => [extendNotif, ...prev]);

                showToast(`Loan extended +15 days for Book #${bookId}.`, 'success');
            };

            const handleAddNewBook = (e) => {
                e.preventDefault();
                const nextId = books.length > 0 ? Math.max(...books.map(b => b.id)) + 1 : 1;
                const newBook = {
                    id: nextId,
                    title: newBookForm.title,
                    author: newBookForm.author,
                    category: newBookForm.category,
                    medium: newBookForm.medium,
                    status: 'Available'
                };
                setBooks(prev => [...prev, newBook]);

                const newNotif = {
                    id: Date.now(),
                    title: `📖 New Book Added: Volume #${nextId} - ${newBookForm.title}`,
                    content: `Author: ${newBookForm.author} | Category: ${newBookForm.category} | Language: ${newBookForm.medium}`,
                    type: 'BOOK',
                    date: new Date().toLocaleDateString(),
                    unread: true
                };
                setNotifications(prev => [newNotif, ...prev]);

                setNewBookForm({ title: '', author: '', category: 'Self Help', medium: 'English' });
                showToast(`New book volume #${nextId} added and user alert sent!`, 'success');
            };

            const markAllNotificationsRead = () => {
                setNotifications(prev => prev.map(n => ({ ...n, unread: false })));
                showToast('All notifications marked as read.', 'info');
            };

            return (
                <div className="flex-1 flex flex-col min-h-screen w-full bg-sky-50/60 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
                    
                    {/* CUSTOM TOAST NOTIFICATION CONTAINER */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl border text-xs font-bold flex items-center space-x-2 animate-fade-in-up ${
                            toast.type === 'success' ? 'bg-sky-900 border-sky-400 text-sky-100' : 'bg-red-900 border-red-500 text-red-100'
                        }`}>
                            <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-sky-300' : 'fa-circle-info text-amber-400'}`}></i>
                            <span>{toast.message}</span>
                        </div>
                    )}

                    {/* MAIN HEADER NAVBAR - ELEGANT SKY BLUE & POSTAL RED STRIPE */}
                    <header className="bg-sky-800 dark:bg-slate-900 border-b-4 border-red-600 text-white shadow-xl sticky top-0 z-30 w-full">
                        <div className="w-full px-4 sm:px-8 lg:px-12 py-3.5 flex items-center justify-between">
                            
                            {/* OFFICIAL INDIA POST LOGO & ELEGANT DYNAMIC TITLE */}
                            <div className="flex items-center space-x-3.5 cursor-pointer group" onClick={() => setActiveView('HOME')}>
                                <div className="w-16 h-12 sm:w-20 sm:h-14 bg-white p-1 rounded-xl border-2 border-amber-400 shadow-lg flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform duration-300 overflow-hidden">
                                    <img 
                                        src={INDIA_POST_LOGO_URL} 
                                        alt="India Post Logo" 
                                        onError={(e) => {
                                            e.target.onerror = null;
                                            e.target.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/India_Post_Logo.svg/512px-India_Post_Logo.svg.png";
                                        }}
                                        className="w-full h-full object-contain p-0.5"
                                    />
                                </div>
                                <div className="flex flex-col justify-center">
                                    <h1 className="font-cinzel font-black text-sm sm:text-xl lg:text-2xl tracking-wider text-amber-300 drop-shadow bg-gradient-to-r from-amber-200 via-amber-400 to-yellow-300 bg-clip-text text-transparent flex items-center space-x-1.5">
                                        <span>{siteContent.title}</span>
                                    </h1>
                                    <p className="text-[10px] sm:text-xs text-sky-100 font-semibold tracking-wide flex items-center space-x-1.5 opacity-95">
                                        <i className="fa-solid fa-building-columns text-amber-400 text-[10px]"></i>
                                        <span>{siteContent.subTitle}</span>
                                    </p>
                                </div>
                            </div>

                            {/* REORDERED HEADER CONTROLS */}
                            <div className="flex items-center space-x-2.5 sm:space-x-3.5">
                                
                                {/* 4TH PLACE FROM RIGHT: 6-LANGUAGE GLOBE DROPDOWN */}
                                <div className="relative">
                                    <button 
                                        onClick={() => setShowLangDropdown(!showLangDropdown)}
                                        className="px-3 py-1.5 bg-sky-950/80 border border-sky-300/60 hover:border-amber-400 text-white rounded-xl shadow transition-all flex items-center space-x-1.5 text-xs font-bold"
                                        title="Select Language"
                                    >
                                        <i className="fa-solid fa-globe text-amber-400 text-sm"></i>
                                        <span className="uppercase text-[11px] font-extrabold">{lang}</span>
                                        <i className="fa-solid fa-chevron-down text-[9px] text-sky-200"></i>
                                    </button>

                                    {showLangDropdown && (
                                        <div className="absolute right-0 mt-2 w-44 bg-sky-950 border-2 border-amber-400 rounded-xl shadow-2xl py-1.5 z-50 animate-fade-in-up text-xs">
                                            {[
                                                { id: 'EN', name: 'English (EN)' },
                                                { id: 'HI', name: 'हिंदी (HI)' },
                                                { id: 'TE', name: 'తెలుగు (TE)' },
                                                { id: 'KN', name: 'ಕನ್ನಡ (KN)' },
                                                { id: 'ML', name: 'മലയാളം (ML)' },
                                                { id: 'TA', name: 'தமிழ் (TA)' }
                                            ].map(item => (
                                                <button
                                                    key={item.id}
                                                    onClick={() => { setLang(item.id); setShowLangDropdown(false); }}
                                                    className={`w-full text-left px-3 py-2 hover:bg-sky-800 hover:text-white transition-all flex items-center justify-between font-medium ${lang === item.id ? 'text-amber-400 font-bold bg-sky-900' : 'text-sky-100'}`}
                                                >
                                                    <span>{item.name}</span>
                                                    {lang === item.id && <i className="fa-solid fa-check text-amber-400 text-xs"></i>}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* 3RD PLACE FROM RIGHT: DARK / LIGHT MODE TOGGLE BUTTON */}
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="w-10 h-10 bg-sky-950/80 hover:bg-sky-900 border border-sky-300/60 text-white rounded-full shadow transition-all flex items-center justify-center text-sm"
                                    title={darkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}
                                >
                                    <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-sky-200'}`}></i>
                                </button>

                                {/* 2ND PLACE FROM RIGHT: USER NOTIFICATION BELL */}
                                <div className="relative">
                                    <button

                                                        value={deskUrlInput}
                                                        onChange={(e) => setDeskUrlInput(e.target.value)}
                                                        className={`flex-1 p-3 border rounded-xl ${darkMode ? 'bg-slate-950 border-sky-900 text-white' : 'bg-white border-sky-200'}`}
                                                    />
                                                    <button 
                                                        type="button"
                                                        onClick={() => {
                                                            if (deskUrlInput.trim()) {
                                                                const url = deskUrlInput.trim();
                                                                safeStorage.setItem('gpo_library_desk_img', url);
                                                                setDeskImage(url);
                                                                setDeskUrlInput('');
                                                                showToast("Desk section image URL applied and saved!", "success");
                                                            }
                                                        }}
                                                        className="px-4 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow shrink-0"
                                                    >
                                                        Apply URL
                                                    </button>
                                                </div>
                                            </div>

                                            <button 
                                                type="button"
                                                onClick={() => {
                                                    safeStorage.setItem('gpo_library_desk_img', DEFAULT_DESK_IMG);
                                                    setDeskImage(DEFAULT_DESK_IMG);
                                                    showToast("Desk section image reset to default.", "info");
                                                }}
                                                className="px-4 py-2 bg-sky-950 hover:bg-sky-900 text-sky-100 text-xs font-bold rounded-xl shadow border border-sky-800"
                                            >
                                                <i className="fa-solid fa-rotate-left mr-1.5"></i> Reset to Default
                                            </button>
                                        </div>

                                        <div className="border border-sky-200 dark:border-sky-900 rounded-xl p-3 bg-sky-50 dark:bg-slate-950 flex flex-col items-center justify-center">
                                            <span className="text-xs text-slate-500 dark:text-slate-400 mb-2 font-bold">Desk Section Image Preview</span>
                                            <div className="w-full h-36 rounded-lg overflow-hidden relative bg-sky-950 border border-sky-900 flex items-center justify-center">
                                                <img 
                                                    src={deskImage} 
                                                    alt="Desk Preview" 
                                                    onError={(e) => { e.target.onerror = null; e.target.src = DEFAULT_DESK_IMG; }}
                                                    className="w-full h-full object-cover"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        )}

                    </main>

                    {/* MODAL: USER NOTIFICATIONS CENTER */}
                    {showNotifModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-md w-full p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowNotifModal(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="flex items-center justify-between border-b border-sky-900 pb-3 mb-4">
                                    <div className="flex items-center space-x-2">
                                        <div className="w-9 h-9 bg-red-600 rounded-full flex items-center justify-center border border-amber-400">
                                            <i className="fa-solid fa-bell text-amber-400 text-sm"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-cinzel font-bold text-base text-amber-300">{t('notifTitle')}</h3>
                                            <p className="text-[11px] text-sky-200">{unreadNotifCount} unread updates</p>
                                        </div>
                                    </div>

                                    {notifications.length > 0 && (
                                        <button 
                                            onClick={markAllNotificationsRead}
                                            className="px-2.5 py-1 bg-sky-900 hover:bg-sky-800 text-amber-400 text-[10px] font-bold rounded-lg border border-sky-800"
                                        >
                                            {t('notifClear')}
                                        </button>
                                    )}
                                </div>

                                {/* NOTIFICATION CATEGORY FILTER BUTTONS */}
                                <div className="flex space-x-1.5 mb-3 text-[11px] font-bold">
                                    <button 
                                        onClick={() => setNotifFilter('ALL')}
                                        className={`px-2.5 py-1 rounded-lg transition-all ${notifFilter === 'ALL' ? 'bg-amber-400 text-slate-950 font-black' : 'bg-sky-900 text-sky-200'}`}
                                    >
                                        {t('notifAll')}
                                    </button>
                                    <button 
                                        onClick={() => setNotifFilter('BOOK')}
                                        className={`px-2.5 py-1 rounded-lg transition-all ${notifFilter === 'BOOK' ? 'bg-amber-400 text-slate-950 font-black' : 'bg-sky-900 text-sky-200'}`}
                                    >
                                        {t('notifBooks')}
                                    </button>
                                    <button 
                                        onClick={() => setNotifFilter('NOTICE')}
                                        className={`px-2.5 py-1 rounded-lg transition-all ${notifFilter === 'NOTICE' ? 'bg-amber-400 text-slate-950 font-black' : 'bg-sky-900 text-sky-200'}`}
                                    >
                                        {t('notifAnnouncements')}
                                    </button>
                                </div>

                                {/* NOTIFICATIONS LIST */}
                                {notifications.length === 0 ? (
                                    <p className="text-xs text-slate-400 italic py-6 text-center">{t('noNotifMsg')}</p>
                                ) : (
                                    <div className="space-y-2.5 max-h-80 overflow-y-auto custom-scrollbar text-xs">
                                        {notifications
                                            .filter(n => notifFilter === 'ALL' || n.type === notifFilter)
                                            .map(notif => (
                                                <div 
                                                    key={notif.id} 
                                                    className={`p-3 rounded-xl border transition-all ${notif.unread ? 'bg-sky-900/60 border-amber-400/60 shadow' : 'bg-sky-950/40 border-sky-900 opacity-80'}`}
                                                >
                                                    <div className="flex justify-between items-start mb-1">
                                                        <span className="font-extrabold text-amber-300 text-xs flex items-center space-x-1.5">
                                                            <i className={`fa-solid ${notif.type === 'BOOK' ? 'fa-book text-emerald-400' : 'fa-bullhorn text-amber-400'}`}></i>
                                                            <span>{notif.title}</span>
                                                        </span>
                                                        {notif.unread && (
                                                            <span className="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
                                                        )}
                                                    </div>
                                                    <p className="text-sky-100 leading-relaxed font-medium text-[11px] my-1">{notif.content}</p>
                                                    <div className="text-[10px] text-sky-300 font-semibold text-right">
                                                        {notif.date}
                                                    </div>
                                                </div>
                                            ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: NOTICE BOARD DETAILS VIEW */}
                    {showNoticeModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-lg w-full p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowNoticeModal(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="flex items-center space-x-3 border-b border-sky-900 pb-3 mb-4">
                                    <div className="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center border border-amber-400">
                                        <i className="fa-solid fa-bullhorn text-amber-400 text-lg"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-cinzel font-bold text-base text-amber-300">{t('noticeBoardTitle')}</h3>
                                        <p className="text-xs text-sky-200">{siteContent.libClub}</p>
                                    </div>
                                </div>

                                {notices.length === 0 ? (
                                    <p className="text-xs text-slate-400 italic py-4 text-center">{t('noNoticesMsg')}</p>
                                ) : (
                                    <div className="space-y-3 max-h-80 overflow-y-auto custom-scrollbar text-xs">
                                        {notices.map(notice => (
                                            <div key={notice.id} className="p-3.5 bg-sky-900/50 border border-sky-800 rounded-xl space-y-1">
                                                <div className="flex justify-between items-start">
                                                    <span className="font-extrabold text-amber-400 text-sm">{notice.title}</span>
                                                    {notice.priority === 'HIGH' && (
                                                        <span className="px-2 py-0.5 bg-red-600 text-white font-extrabold text-[9px] rounded-full uppercase">
                                                            {t('importantNotice')}
                                                        </span>
                                                    )}
                                                </div>
                                                <p className="text-sky-100 leading-relaxed font-medium">{notice.content}</p>
                                                <div className="text-[10px] text-sky-300 font-semibold pt-1 text-right">
                                                    Date: {notice.date}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: ADMIN LOGIN WITH SHOW/HIDE PASSWORD TOGGLE */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-sm w-full p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowAdminLogin(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="text-center mb-5">
                                    <div className="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-2 shadow border border-amber-400">
                                        <i className="fa-solid fa-user-shield text-amber-400 text-xl"></i>
                                    </div>
                                    <h3 className="font-cinzel font-bold text-base text-amber-300">{t('adminLoginTitle')}</h3>
                                </div>

                                <form onSubmit={handleAdminLogin} className="space-y-4 text-xs font-semibold">
                                    <div>
                                        <label className="block mb-1 text-sky-200">{t('enterPass')}</label>
                                        <div className="relative">
                                            <input 
                                                type={showAdminPassword ? "text" : "password"} 
                                                required
                                                placeholder="••••••••"
                                                value={adminPassword}
                                                onChange={(e) => setAdminPassword(e.target.value)}
                                                className="w-full p-2.5 pr-10 bg-slate-900 border border-sky-800 rounded-xl text-white focus:outline-none focus:border-amber-400"
                                            />
                                            <button 
                                                type="button"
                                                onClick={() => setShowAdminPassword(!showAdminPassword)}
                                                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 text-sm"
                                                title={showAdminPassword ? t('hidePass') : t('showPass')}
                                            >
                                                <i className={`fa-solid ${showAdminPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                    </div>

                                    {loginError && <p className="text-red-400 font-bold">{loginError}</p>}

                                    <button 
                                        type="submit"
                                        className="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow"
                                    >
                                        {t('loginBtn')}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: REJECT REQUISITION MODAL */}
                    {showRejectModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-sm w-full p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowRejectModal(null)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <h3 className="font-cinzel font-bold text-base text-amber-300 mb-3">{t('rejectModalTitle')}</h3>
                                <p className="text-xs text-sky-200 mb-2">{t('bookNoLabel')} {showRejectModal.bookId} - {showRejectModal.bookTitle}</p>
                                
                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-300 mb-1">{t('rejectReasonLabel')}</label>
                                        <textarea 
                                            rows="3"
                                            value={rejectReason}
                                            onChange={(e) => setRejectReason(e.target.value)}
                                            placeholder="e.g. Book under maintenance or reference only"
                                            className="w-full p-2.5 bg-slate-900 border border-sky-800 rounded-xl text-white focus:outline-none focus:border-amber-400"
                                        ></textarea>
                                    </div>
                                    <button 
                                        onClick={handleConfirmReject}
                                        className="w-full py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow"
                                    >
                                        {t('confirmRejectBtn')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: APP INSTALLATION GUIDE */}
                    {showInstallModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-md w-full p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowInstallModal(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="text-center mb-4">
                                    <div className="w-12 h-12 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-2 border border-amber-400 shadow-lg">
                                        <i className="fa-solid fa-mobile-screen-button text-amber-200 text-xl"></i>
                                    </div>
                                    <h3 className="font-cinzel font-bold text-base text-amber-300">{t('installModalTitle')}</h3>
                                    <p className="text-xs text-sky-200 mt-1">{t('installModalSub')}</p>
                                </div>

                                <div className="space-y-3 text-xs bg-slate-900 p-4 rounded-xl border border-sky-900">
                                    <div className="font-bold text-amber-400 border-b border-sky-800 pb-2">
                                        Installation Options:
                                    </div>
                                    {apkUrl ? (
                                        <div className="space-y-2">
                                            <p className="text-sky-100">Direct Download Link is available!</p>
                                            <a 
                                                href={apkUrl} 
                                                target="_blank" 
                                                rel="noreferrer"
                                                className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow flex items-center justify-center space-x-1.5"
                                            >
                                                <i className="fa-brands fa-google-drive"></i>
                                                <span>Download APK / Open Link</span>
                                            </a>
                                        </div>
                                    ) : (
                                        <>
                                            <p className="text-sky-100">{t('installStep1')}</p>
                                            <p className="text-sky-100">{t('installStep2')}</p>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SMART & MINIMALIST APP INSTALL FLOATING PILL WITH CONTINUOUS FLOATING & LIGHT PULSING GLOW ANIMATION */}
                    {showInstallPopup && (
                        <div className="fixed bottom-4 left-4 z-40 bg-sky-950/95 backdrop-blur-lg border-2 border-amber-400/80 text-white py-1.5 px-3.5 rounded-full shadow-2xl animate-float-glow flex items-center space-x-2.5 transition-all">
                            <div className="w-7 h-7 bg-amber-400/20 border border-amber-400/50 rounded-full flex items-center justify-center shrink-0">
                                <i className="fa-solid fa-mobile-screen-button text-amber-400 text-xs"></i>
                            </div>
                            <div className="flex flex-col pr-1 text-left">
                                <span className="font-extrabold text-[11px] text-amber-300 leading-tight">{t('installTitle')}</span>
                                <span className="text-[9px] text-sky-200 font-medium">Quick Access</span>
                            </div>
                            <button 
                                onClick={() => {
                                    if (apkUrl) {
                                        window.open(apkUrl, '_blank');
                                    } else if (deferredPrompt) {
                                        deferredPrompt.prompt();
                                        deferredPrompt.userChoice.then(() => setDeferredPrompt(null));
                                    } else {
                                        setShowInstallModal(true);
                                    }
                                }}
                                className="px-3.5 py-1 bg-red-600 hover:bg-red-700 text-white font-bold rounded-full text-[11px] shadow transition-all flex items-center space-x-1 shrink-0 active:scale-95 border border-amber-400/40"
                            >
                                <i className="fa-solid fa-download text-[9px]"></i>
                                <span>{t('installBtn')}</span>
                            </button>
                            <button 
                                onClick={() => {
                                    setShowInstallPopup(false);
                                    safeSession.setItem('gpo_app_popup_dismissed', 'true');
                                }}
                                className="w-5 h-5 rounded-full bg-sky-900 hover:bg-sky-800 text-sky-200 hover:text-white flex items-center justify-center text-[9px] transition-all shrink-0"
                                title="Close"
                            >
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
