                    return { isOpen: false, reason: "Sunday Closed" };

                const currentMinutes = now.getHours() * 60 + now.getMinutes();
                const morningStart = 9 * 60;
                const morningEnd = 11 * 60;
                const eveningStart = 15 * 60;
                const eveningEnd = 17 * 60;

                const isMorningSlot = currentMinutes >= morningStart && currentMinutes < morningEnd;
                const isEveningSlot = currentMinutes >= eveningStart && currentMinutes < eveningEnd;

                const cleanMobile = reqForm.mobile.trim().replace(/[^0-9]/g, '');

                    errors.mobile = "Valid 10-digit mobile number is required.";

                if (reqForm.email.trim() && !/\S+@\S+\.\S+/.test(reqForm.email.trim())) {

                }

                setReqErrors(errors);
                return Object.keys(errors).length === 0;

                    return;
                }

                if (targetBook.status !== 'Available') {

                    return;
                }

                const accNo = targetBook.accession_no || targetBook.book_no || String(targetBook.id);

                const nowFormatted = new Date().toLocaleDateString('en-IN') + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const reqPayload = {
                    book_id: targetBook.id,
                    accession_no: accNo,
                    book_no: accNo,
                    book_title: targetBook.title,
                    emp_name: reqForm.empName.trim(),
                    emp_id: reqForm.empId.trim(),
                    cadre: reqForm.cadre,
                    branch: reqForm.branch,
                    mobile: reqForm.mobile.trim(),
                    email: reqForm.email.trim() || 'N/A',
                    status: 'PENDING',

                                </div>

                                {authMessage && (
                                    <div className="p-3 mb-3 text-xs sm:text-sm rounded-xl bg-red-100 dark:bg-red-950/80 text-red-700 dark:text-red-300 font-extrabold">
                                        {authMessage}
                                    </div>
                                )}

                                <form onSubmit={handleAdminLogin} className="space-y-4 text-xs sm:text-sm font-black">
                                    <div>
                                        <label className="block mb-1 text-slate-700 dark:text-sky-200">Admin Email:</label>
                                        <input 
                                            type="email" 
                                            value={authEmail} 
                                            onChange={(e) => setAuthEmail(e.target.value)} 
                                            className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950" 
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block mb-1 text-slate-700 dark:text-sky-200">Password:</label>
                                        <input 
                                            type="password" 
                                            value={authPassword} 
                                            onChange={(e) => setAuthPassword(e.target.value)} 
                                            placeholder="admin123 / delhigpo / Crsp5040@"
                                            className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950" 
                                            required 
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        disabled={authLoading}
                                        className="w-full py-3 bg-sky-800 hover:bg-sky-900 text-white font-black rounded-xl shadow transition-all disabled:opacity-50 text-sm"
                                    >
                                        {authLoading ? 'Authenticating...' : 'Login to Admin Desk'}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<MainApp />);
        } catch(e) {
            console.error("Render error:", e);
        }
    </script>
</body>
</html>
