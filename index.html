        function MainApp() {
            const [lang, setLang] = useState(() => safeStorage.getItem('gpo_library_lang') || 'EN');
            const [showLangDropdown, setShowLangDropdown] = useState(false);
            const [darkMode, setDarkMode] = useState(() => safeStorage.getItem('gpo_library_theme') === 'dark');

            // AUTOMATIC REAL DEVICE SCREEN WIDTH DETECTOR
            const getAutoScreenMode = useCallback(() => {
                const w = window.innerWidth;
                if (w >= 1024) return 'desktop';
                if (w >= 768) return 'tablet';
                return 'mobile';
            }, []);

            const [screenMode, setScreenMode] = useState(getAutoScreenMode);
            const [showScreenModeDropdown, setShowScreenModeDropdown] = useState(false);
            const [isManualOverride, setIsManualOverride] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleResize = () => {
                    if (!isManualOverride) {
                        setScreenMode(getAutoScreenMode());
                    }
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, [isManualOverride, getAutoScreenMode]);

            const [isLoading, setIsLoading] = useState(true);
            const [settingsLoading, setSettingsLoading] = useState(true);

            const [siteSettings, setSiteSettings] = useState({});
            const [siteContent, setSiteContent] = useState(DEFAULT_SITE_CONTENT);
            const [holidays, setHolidays] = useState(OFFICIAL_DELHI_CIRCLE_HOLIDAYS_2026);
            const [toast, setToast] = useState(null);

            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            const [isApkPopupOpen, setIsApkPopupOpen] = useState(false);

            const [socialChannels, setSocialChannels] = useState(INITIAL_SOCIAL_CHANNELS);
            const [socialUpdates, setSocialUpdates] = useState([]);
            const [newSocialUpdateForm, setNewSocialUpdateForm] = useState({
                platform: 'whatsapp',
                title: '',
                url: '',
                thumbnail: ''
            });

            const [greetings, setGreetings] = useState([]);
            const [newGreetingForm, setNewGreetingForm] = useState({
                text: '',
                durationHours: '24'
            });

            const [reqForm, setReqForm] = useState({
                bookId: '',
                empName: '',
                empId: '',
                cadre: '',
                branch: '',
                mobile: '',
                email: ''
            });

            const showToast = useCallback((message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            }, []);

            const closeApkPopup = useCallback(() => {
                setIsApkPopupOpen(false);
            }, []);

            const libraryWorkingStatus = useMemo(() => {
                try {
                    const nowISTStr = new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" });
                    const todayIST = new Date(nowISTStr);

                    const year = todayIST.getFullYear();
                    const month = String(todayIST.getMonth() + 1).padStart(2, '0');
                    const day = String(todayIST.getDate()).padStart(2, '0');
                    const formattedDate = `${year}-${month}-${day}`;

                    const dayOfWeek = todayIST.getDay();

                    const matchedHoliday = holidays.find(h => h.date === formattedDate);
                    if (matchedHoliday) {
                        return { 
                            isOpen: false, 
                            badgeText: `Closed — ${matchedHoliday.name}`, 
                            type: 'holiday'
                        };
                    }

                    if (dayOfWeek === 0) {
                        return { 
                            isOpen: false, 
                            badgeText: `Closed Today (Sunday)`, 
                            type: 'closed'
                        };
                    }

                    return { 
                        isOpen: true, 
                        badgeText: TRANSLATIONS[lang]?.infoStatusOpen || "Open Today", 
                        type: 'open'
                    };
                } catch (e) {
                    console.warn("Working status calculation fallback:", e);
                    return { 
                        isOpen: null, 
                        badgeText: TRANSLATIONS[lang]?.infoStatusFallback || "Please check library timings", 
                        type: 'fallback'
                    };
                }
            }, [holidays, lang]);

            const [books, setBooks] = useState(INITIAL_BOOKS);
            const [requisitions, setRequisitions] = useState([]);
            const [notices, setNotices] = useState([
                { id: 1, title: "Independence Day Greetings", content: "Delhi GPO – 110006 Recreation Club Library wishes all employees and members a very Happy Independence Day!", date: "2026-08-15", read: false }
            ]);

            const [isNotifOpen, setIsNotifOpen] = useState(false);
            const unreadNotifCount = useMemo(() => notices.filter(n => !n.read).length, [notices]);

            const [activeView, setActiveView] = useState('HOME');
            const [viewMode, setViewMode] = useState('GRID');
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('ALL');
            const [mediumFilter, setMediumFilter] = useState('ALL');
            const [sortOption, setSortOption] = useState('SERIAL_ASC');
            const [currentPage, setCurrentPage] = useState(1);

            const activeMarqueeMessage = useMemo(() => {
                const nowMs = Date.now();
                const validActiveGreeting = greetings.find(g => {
                    if (!g.active) return false;
                    const end = new Date(g.endTime).getTime();
                    const start = new Date(g.startTime).getTime();
                    return nowMs >= start && nowMs <= end;
                });

                if (validActiveGreeting) {
                    return { text: validActiveGreeting.text };
                }

                try {
                    const nowISTStr = new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" });
                    const todayIST = new Date(nowISTStr);
                    const month = String(todayIST.getMonth() + 1).padStart(2, '0');
                    const day = String(todayIST.getDate()).padStart(2, '0');
                    const mmdd = `${month}-${day}`;

                    const matchedOccasion = ANNUAL_SPECIAL_OCCASIONS.find(o => o.date === mmdd);
                    if (matchedOccasion) {
                        return { text: matchedOccasion.wish };
                    }
                } catch (e) {
                    console.warn("Occasion lookup error:", e);
                }

                return {
                    text: "Delhi GPO – 110006 Recreation Club Library wishes all employees and members a very Happy Independence Day!"
                };
            }, [greetings]);

            const activeSocialBadges = useMemo(() => {
                const badgeMap = {};
                socialUpdates.forEach(update => {
                    if (!update.read && update.platform) {
                        badgeMap[update.platform] = (badgeMap[update.platform] || 0) + 1;
                    }
                });
                return badgeMap;
            }, [socialUpdates]);

            const loadSiteSettings = useCallback(async () => {
                setSettingsLoading(true);
                if (!supabaseClient) {
                    setSettingsLoading(false);
                    return;
                }
                try {
                    const { data, error } = await supabaseClient
                        .from('site_settings')
                        .select('setting_key, setting_value');

                    if (!error && data && data.length > 0) {
                        const loadedObj = {};
                        data.forEach(item => {
                            if (item.setting_key && item.setting_value) {
                                loadedObj[item.setting_key] = item.setting_value;
                            }
                        });
                        setSiteSettings(loadedObj);
                    }
                } catch (err) {
                    console.warn("Failed to load site settings from Supabase:", err);
                } finally {
                    setSettingsLoading(false);
                }
            }, []);

            const fetchAllData = useCallback(async () => {
                setIsLoading(true);
                try {
                    await loadSiteSettings();
                    if (supabaseClient) {
                        const { data: bData } = await supabaseClient.from('books').select('*').order('id', { ascending: true });
                        if (bData && bData.length > 0) setBooks(bData);

                        const { data: nData } = await supabaseClient.from('notices').select('*').order('created_at', { ascending: false });
                        if (nData && nData.length > 0) setNotices(nData);

                        const { data: rData } = await supabaseClient.from('requisitions').select('*').order('created_at', { ascending: false });
                        if (rData && rData.length > 0) setRequisitions(rData);

                        const { data: gData } = await supabaseClient.from('special_greetings').select('*').order('created_at', { ascending: false });
                        if (gData && gData.length > 0) setGreetings(gData);

                        const { data: sData } = await supabaseClient.from('social_updates').select('*').order('created_at', { ascending: false });
                        if (sData && sData.length > 0) setSocialUpdates(sData);
                    }
                } catch (err) {
                    console.error("Supabase load error:", err);
                } finally {
                    setIsLoading(false);
                }
            }, [loadSiteSettings]);

            useEffect(() => {
                fetchAllData();

                let settingsChannel = null;
                if (supabaseClient) {
                    settingsChannel = supabaseClient
                        .channel('realtime:site_settings')
                        .on('postgres_changes', { event: '*', schema: 'public', table: 'site_settings' }, () => {
                            loadSiteSettings();
                        })
                        .subscribe();
                }

                return () => {
                    if (supabaseClient && settingsChannel) {
                        supabaseClient.removeChannel(settingsChannel);
                    }
                };
            }, [fetchAllData, loadSiteSettings]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_theme', darkMode ? 'dark' : 'light');
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            useEffect(() => {
                safeStorage.setItem('gpo_library_lang', lang);
            }, [lang]);

            useEffect(() => {
                const timer = setTimeout(() => {
                    setIsApkPopupOpen(true);
                }, 1000);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape') {
                        closeApkPopup();
                        setShowAdminLogin(false);
                        setIsNotifOpen(false);
                        setShowLangDropdown(false);
                        setShowScreenModeDropdown(false);
                        setIsMobileMenuOpen(false);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [closeApkPopup]);

            const t = (key) => TRANSLATIONS[lang]?.[key] || TRANSLATIONS['EN']?.[key] || key;

            const handleRequisitionSubmit = async (e) => {
                e.preventDefault();
                if (!reqForm.bookId || !reqForm.empName || !reqForm.empId || !reqForm.mobile) {
                    showToast("Please fill all required fields.", "error");
                    return;
                }

                if (!/^\d{10}$/.test(reqForm.mobile.trim())) {
                    showToast("Please enter a valid 10-digit mobile number.", "error");
                    return;
                }

                const targetBook = books.find(b => b.id.toString() === reqForm.bookId.toString());
                if (!targetBook) {
                    showToast("Selected book not found.", "error");
                    return;
                }

                if (targetBook.status === 'Issued') {
                    showToast("This book is currently issued to another member.", "error");
                    return;
                }

                const isDuplicate = requisitions.some(
                    r => r.bookId === targetBook.id && r.empId === reqForm.empId && r.status === 'PENDING'
                );
                if (isDuplicate) {
                    showToast("A pending request already exists for this book and Employee ID.", "error");
                    return;
                }

                const newReq = {
                    id: Date.now(),
                    bookId: targetBook.id,
                    bookTitle: targetBook.title,
                    empName: reqForm.empName,
                    empId: reqForm.empId,
                    cadre: reqForm.cadre || 'N/A',
                    branch: reqForm.branch || 'N/A',
                    mobile: reqForm.mobile,
                    email: reqForm.email || 'N/A',
                    status: 'PENDING',
                    requestDate: new Date().toLocaleDateString()
                };

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('requisitions').insert([newReq]);
                    } catch(err) {
                        console.warn("Supabase requisition error:", err);
                    }
                }

                setRequisitions([newReq, ...requisitions]);
                showToast("Requisition submitted successfully! Librarian will review.", "success");
                setReqForm({ bookId: '', empName: '', empId: '', cadre: '', branch: '', mobile: '', email: '' });
                setActiveView('TOTAL_BOOKS');
            };

            const handleApproveReq = async (reqId) => {
                const reqItem = requisitions.find(r => r.id === reqId);
                if (!reqItem) return;

                const updatedBooks = books.map(b => {
                    if (b.id === reqItem.bookId) {
                        return { ...b, status: 'Issued', issuedTo: `${reqItem.empName} (${reqItem.empId})` };
                    }
                    return b;
                });
                setBooks(updatedBooks);

                const updatedReqs = requisitions.map(r => r.id === reqId ? { ...r, status: 'APPROVED' } : r);
                setRequisitions(updatedReqs);

                if (supabaseClient) {
                    try {
                        await supabaseClient.from('books').update({ status: 'Issued', issuedTo: `${reqItem.empName} (${reqItem.empId})` }).eq('id', reqItem.bookId);
                        await supabaseClient.from('requisitions').update({ status: 'APPROVED' }).eq('id', reqId);
                    } catch(e) { console.warn("Approve sync warning:", e); }
                }

                showToast(`Book #${reqItem.bookId} approved and issued to ${reqItem.empName}.`, 'success');
            };

            const handleRejectReq = async (reqId) => {
                const updatedReqs = requisitions.map(r => r.id === reqId ? { ...r, status: 'REJECTED' } : r);
                setRequisitions(updatedReqs);
                if (supabaseClient) {
                    try {
                        await supabaseClient.from('requisitions').update({ status: 'REJECTED' }).eq('id', reqId);
                    } catch(e) { console.warn("Reject sync warning:", e); }
                }
                showToast("Requisition rejected.", "error");
            };

            const handleAddNewGreeting = async (e) => {
                e.preventDefault();
                if (!newGreetingForm.text.trim()) {
                    showToast("Please enter greeting text.", "error");
                    return;
                }

                const hours = parseInt(newGreetingForm.durationHours, 10) || 24;
                const now = new Date();
                const end = new Date(now.getTime() + hours * 60 * 60 * 1000);

                const greetingObj = {
                    id: Date.now(),
                    text: newGreetingForm.text.trim(),
                    startTime: now.toISOString(),
                    endTime: end.toISOString(),
                    active: true,
                    created_at: new Date().toISOString()
                };

                setGreetings([greetingObj, ...greetings]);
                if (supabaseClient) {
                    try {
                        await supabaseClient.from('special_greetings').insert([greetingObj]);
                    } catch(err) {
                        console.warn("Greeting insert error:", err);
                    }
                }

                showToast(`Special greeting published! Will auto-expire in ${hours} hours.`, "success");
                setNewGreetingForm({ text: '', durationHours: '24' });
            };

            const handleToggleGreetingStatus = async (greetingId) => {
                const updated = greetings.map(g => g.id === greetingId ? { ...g, active: !g.active } : g);
                setGreetings(updated);
                const item = updated.find(g => g.id === greetingId);
                if (supabaseClient && item) {
                    try {
                        await supabaseClient.from('special_greetings').update({ active: item.active }).eq('id', greetingId);
                    } catch(e) { console.warn("Greeting toggle error:", e); }
                }
            };

            const handleDeleteGreeting = async (greetingId) => {
                setGreetings(greetings.filter(g => g.id !== greetingId));
                if (supabaseClient) {
                    try {
                        await supabaseClient.from('special_greetings').delete().eq('id', greetingId);
                    } catch(e) { console.warn("Greeting delete error:", e); }
                }
                showToast("Greeting deleted.", "success");
            };

            const handleAddNewSocialUpdate = async (e) => {
                e.preventDefault();
                if (!newSocialUpdateForm.title.trim() || !newSocialUpdateForm.url.trim()) {
                    showToast("Please enter post title and official URL.", "error");
                    return;
                }

                const updateObj = {
                    id: Date.now(),
                    platform: newSocialUpdateForm.platform,
                    title: newSocialUpdateForm.title.trim(),
                    url: newSocialUpdateForm.url.trim(),
                    thumbnail: newSocialUpdateForm.thumbnail.trim(),
                    read: false,
                    created_at: new Date().toISOString()
                };

                setSocialUpdates([updateObj, ...socialUpdates]);
                if (supabaseClient) {
                    try {
                        await supabaseClient.from('social_updates').insert([updateObj]);
                    } catch(err) {
                        console.warn("Social update error:", err);
                    }
                }

                showToast(`Official update published for ${newSocialUpdateForm.platform.toUpperCase()}! Badge updated.`, "success");
                setNewSocialUpdateForm({ platform: 'whatsapp', title: '', url: '', thumbnail: '' });
            };

            const markSocialChannelUpdatesRead = (platform) => {
                setSocialUpdates(socialUpdates.map(u => u.platform === platform ? { ...u, read: true } : u));
            };

            const filteredBooks = useMemo(() => {
                return books.filter(book => {
                    if (activeView === 'AVAIL_BOOKS' && book.status !== 'Available') return false;
                    if (activeView === 'ISSUED_BOOKS' && book.status !== 'Issued') return false;

                    const matchesSearch = (book.title || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          (book.author || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          (book.id || '').toString().includes(searchTerm);
                    
                    const matchesCategory = categoryFilter === 'ALL' || book.category === categoryFilter;
                    const matchesMedium = mediumFilter === 'ALL' || book.medium === mediumFilter;

                    return matchesSearch && matchesCategory && matchesMedium;
                }).sort((a, b) => {
                    if (sortOption === 'SERIAL_ASC') return (a.id || 0) - (b.id || 0);
                    if (sortOption === 'SERIAL_DESC') return (b.id || 0) - (a.id || 0);
                    if (sortOption === 'A-Z') return (a.title || '').localeCompare(b.title || '');
                    if (sortOption === 'Z-A') return (b.title || '').localeCompare(a.title || '');
                    return 0;
                });
            }, [books, activeView, searchTerm, categoryFilter, mediumFilter, sortOption]);

            const pageSize = 15;
            const totalPages = Math.ceil(filteredBooks.length / pageSize) || 1;
            const paginatedBooks = useMemo(() => {
                const start = (currentPage - 1) * pageSize;
                return filteredBooks.slice(start, start + pageSize);
            }, [filteredBooks, currentPage]);

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassword === 'Crsp5040@') {
                    setIsAdminLoggedIn(true);
                    setShowAdminLogin(false);
                    setAdminPassword('');
                    setLoginError('');
                    setActiveView('ADMIN_PANEL');
                    showToast('Authenticated successfully as Librarian Admin.', 'success');
                } else {
                    setLoginError('Invalid secret password.');
                }
            };

            const handleApkDownloadClick = () => {
                const apkUrl = siteSettings.apk_url || FALLBACK_APK_URL;
                window.open(apkUrl, "_blank", "noopener,noreferrer");
            };

            const markAllNoticesRead = () => {
                setNotices(notices.map(n => ({ ...n, read: true })));
                showToast("All notifications marked as read.", "success");
            };

            const totalBookCount = useMemo(() => books.length, [books]);
            const availBookCount = useMemo(() => books.filter(b => b.status === 'Available').length, [books]);
            const issuedBookCount = useMemo(() => books.filter(b => b.status === 'Issued').length, [books]);
            const pendingReqCount = useMemo(() => requisitions.filter(r => r.status === 'PENDING').length, [requisitions]);

            const getContainerWidthClass = () => {
                if (screenMode === 'mobile') return 'max-w-sm mx-auto shadow-2xl border-x border-slate-300 dark:border-slate-800 transition-all duration-300';
                if (screenMode === 'tablet') return 'max-w-3xl mx-auto shadow-xl border-x border-slate-300 dark:border-slate-800 transition-all duration-300';
                return 'w-full max-w-full transition-all duration-300';
            };

            return (
                <div className={`flex-1 flex flex-col min-h-screen bg-sky-50/60 dark:bg-slate-950 text-slate-900 dark:text-slate-100 overflow-x-hidden ${getContainerWidthClass()}`}>
                    
                    {}
                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed top-3 right-3 sm:top-4 sm:right-4 z-50 max-w-[calc(100vw-1.5rem)] px-3 py-2.5 sm:px-4 sm:py-3 rounded-xl shadow-2xl border text-xs font-bold flex items-center space-x-2 animate-slide-down ${
                            toast.type === 'success' ? 'bg-sky-900 border-sky-400 text-sky-100' : 'bg-red-900 border-red-500 text-red-100'
                        }`}>
                            <i className={`fa-solid ${toast.type === 'success' ? 'fa-circle-check text-sky-300' : 'fa-circle-info text-amber-400'}`}></i>
                            <span className="truncate">{toast.message}</span>
                        </div>
                    )}

                    {/* DYNAMIC SEAMLESS MARQUEE BANNER WITH ZERO BLANK GAP */}
                    <div className="bg-gradient-to-r from-red-600 via-amber-500 to-red-600 text-white font-bold px-3 py-1.5 text-xs overflow-hidden shadow-sm flex items-center w-full max-w-full">
                        <div className="mr-2.5 text-amber-300 font-extrabold shrink-0 text-xs sm:text-sm whitespace-nowrap flex items-center justify-center">
                            Welcome To
                        </div>
                        <div className="overflow-hidden whitespace-nowrap w-full flex">
                            <div className="animate-marquee-seamless font-semibold">
                                <span className="inline-block text-white pr-16">{activeMarqueeMessage.text}</span>
                                <span className="inline-block text-white pr-16">{activeMarqueeMessage.text}</span>
                            </div>
                        </div>
                    </div>

                    {/* MAIN HEADER - COORDINATED DECENT COLOR GROUP */}
                    <header className="bg-sky-800 dark:bg-slate-900 border-b-4 border-red-600 text-white shadow-xl sticky top-0 z-40 w-full max-w-full">
                        <div className="w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3.5 space-y-2.5">
                            
                            {/* TOP HEADER ROW: LOGO + TITLE AND RIGHT CONTROLS */}
                            <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-2.5 sm:gap-3">
                                
                                {/* LOGO & BRAND IDENTITY TEXT */}
                                <div 
                                    className="flex items-center space-x-2.5 sm:space-x-3 cursor-pointer group shrink w-full md:w-auto"
                                    onClick={() => setActiveView('HOME')}
                                >
                                    <div className="w-10 h-10 sm:w-12 sm:h-12 rounded-full overflow-hidden bg-white border border-sky-300 dark:border-sky-700 shadow-sm shrink-0 p-0.5 flex items-center justify-center">
                                        <img 
                                            src={siteSettings.site_logo_url || FALLBACK_LOGO_URL} 
                                            alt="Delhi GPO Logo" 
                                            className="w-full h-full object-contain rounded-full"
                                            onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_LOGO_URL; }}
                                        />
                                    </div>
                                    <div className="min-w-0 flex-1">
                                        <h1 className="font-cinzel font-black text-sm sm:text-base lg:text-lg tracking-wide text-amber-300 group-hover:text-white transition-colors truncate">
                                            {siteContent.title}
                                        </h1>
                                        <p className="text-[10px] sm:text-xs text-sky-200 font-semibold truncate leading-tight">
                                            {siteContent.subTitle}
                                        </p>
                                    </div>
                                </div>

                                {/* RIGHT ACTION CONTROLS */}
                                <div className="flex flex-wrap items-center justify-between sm:justify-end gap-1.5 sm:gap-2 shrink-0 w-full md:w-auto pt-1 md:pt-0 border-t border-sky-700/50 md:border-t-0">
                                    
                                    {/* 1. LANGUAGE SELECTOR */}
                                    <div className="relative">
                                        <button 
                                            onClick={() => { setShowLangDropdown(!showLangDropdown); setShowScreenModeDropdown(false); }}
                                            className="px-2.5 py-1.5 min-h-[40px] bg-sky-900/90 hover:bg-sky-700 text-amber-300 rounded-xl text-xs font-black border border-sky-400/80 hover:border-amber-400 flex items-center space-x-1 transition-all shadow-sm"
                                            title="Language Selector"
                                        >
                                            <i className="fa-solid fa-language text-sm"></i>
                                            <span>{lang}</span>
                                            <i className="fa-solid fa-chevron-down text-[10px] ml-0.5"></i>
                                        </button>
                                        
                                        {showLangDropdown && (
                                            <div className="absolute right-0 mt-1.5 w-36 bg-white dark:bg-slate-900 border border-sky-200 dark:border-sky-800 rounded-xl shadow-2xl py-1 z-50 text-xs text-slate-800 dark:text-slate-100 font-bold">
                                                {[
                                                    { code: 'EN', name: 'English' },
                                                    { code: 'HI', name: 'हिंदी' },
                                                    { code: 'TE', name: 'తెలుగు' },
                                                    { code: 'ML', name: 'മലയാളം' },
                                                    { code: 'KN', name: 'ಕನ್ನಡ' },
                                                    { code: 'TA', name: 'தமிழ்' }
                                                ].map(item => (
                                                    <button 
                                                        key={item.code}
                                                        onClick={() => { setLang(item.code); setShowLangDropdown(false); }}
                                                        className={`w-full text-left px-3 py-1.5 hover:bg-sky-100 dark:hover:bg-slate-800 flex items-center justify-between ${lang === item.code ? 'text-red-600 dark:text-amber-400 font-black bg-sky-50 dark:bg-slate-800/60' : ''}`}
                                                    >
                                                        <span>{item.name}</span>
                                                        {lang === item.code && <i className="fa-solid fa-check text-xs"></i>}
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* 2. SCREEN MODE SELECTOR (ICON ONLY) */}
                                    <div className="relative">
                                        <button 
                                            onClick={() => { setShowScreenModeDropdown(!showScreenModeDropdown); setShowLangDropdown(false); }}
                                            className="px-2.5 py-1.5 min-h-[40px] min-w-[40px] bg-sky-900/90 hover:bg-sky-700 text-amber-300 rounded-xl text-xs font-black border border-sky-400/80 hover:border-amber-400 flex items-center justify-center transition-all shadow-sm"
                                            title="Screen Mode Selector"
                                            aria-label="Screen Mode Selector"
                                        >
                                            <i className={`fa-solid ${screenMode === 'mobile' ? 'fa-mobile-screen-button' : screenMode === 'tablet' ? 'fa-tablet-screen-button' : 'fa-desktop'} text-sm`}></i>
                                        </button>
                                        
                                        {showScreenModeDropdown && (
                                            <div className="absolute right-0 mt-1.5 p-1.5 bg-white dark:bg-slate-900 border border-sky-200 dark:border-sky-800 rounded-xl shadow-2xl z-50 flex items-center space-x-1 text-slate-800 dark:text-slate-100 font-bold">
                                                {[
                                                    { id: 'desktop', title: 'Desktop View', icon: 'fa-desktop' },
                                                    { id: 'tablet', title: 'Tablet View', icon: 'fa-tablet-screen-button' },
                                                    { id: 'mobile', title: 'Mobile View', icon: 'fa-mobile-screen-button' }
                                                ].map(mode => (
                                                    <button 
                                                        key={mode.id}
                                                        onClick={() => {
                                                            setScreenMode(mode.id);
                                                            setIsManualOverride(true);
                                                            setShowScreenModeDropdown(false);
                                                        }}
                                                        title={mode.title}
                                                        aria-label={mode.title}
                                                        className={`p-2 rounded-lg hover:bg-sky-100 dark:hover:bg-slate-800 flex items-center justify-center transition-colors ${screenMode === mode.id ? 'text-red-600 dark:text-amber-400 bg-sky-50 dark:bg-slate-800/80 border border-amber-400/50' : 'text-slate-600 dark:text-slate-300'}`}
                                                    >
                                                        <i className={`fa-solid ${mode.icon} text-sm`}></i>
                                                    </button>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* 3. DAY / NIGHT TOGGLE */}
                                    <button 
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="p-2 min-h-[40px] min-w-[40px] bg-sky-900/90 hover:bg-sky-700 text-amber-300 rounded-xl text-xs font-bold border border-sky-400/80 hover:border-amber-400 transition-all shadow-sm flex items-center justify-center"
                                        title="Toggle Day/Night Mode"
                                    >
                                        <i className={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon text-sky-200'}`}></i>
                                    </button>

                                    {/* 4. NOTIFICATION BUTTON */}
                                    <button 
                                        onClick={() => setIsNotifOpen(!isNotifOpen)}
                                        className="p-2 min-h-[40px] min-w-[40px] bg-sky-900/90 hover:bg-sky-700 text-amber-300 rounded-xl text-xs font-bold border border-sky-400/80 hover:border-amber-400 relative transition-all shadow-sm flex items-center justify-center"
                                        title="Notifications"
                                    >
                                        <i className="fa-solid fa-bell"></i>
                                        {unreadNotifCount > 0 && (
                                            <span className="absolute -top-1 -right-1 w-4 h-4 bg-red-600 text-white text-[9px] font-black rounded-full flex items-center justify-center shadow-md animate-pulse">
                                                {unreadNotifCount}
                                            </span>
                                        )}
                                    </button>

                                    {/* 5. ADMIN BUTTON */}
                                    {isAdminLoggedIn ? (
                                        <button 
                                            onClick={() => setActiveView('ADMIN_PANEL')}
                                            className="px-2.5 py-1.5 min-h-[40px] bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs rounded-xl shadow transition-all border border-amber-300 flex items-center space-x-1"
                                        >
                                            <i className="fa-solid fa-user-gear"></i>
                                            <span className="hidden sm:inline">{t('adminPanelBtn')}</span>
                                            {pendingReqCount > 0 && (
                                                <span className="ml-1 px-1.5 py-0.2 bg-red-700 text-white rounded-full text-[10px] font-black">{pendingReqCount}</span>
                                            )}
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => setShowAdminLogin(true)}
                                            className="p-2 min-h-[40px] min-w-[40px] bg-sky-900/90 hover:bg-sky-700 text-amber-300 rounded-xl text-xs font-bold border border-sky-400/80 hover:border-amber-400 transition-all flex items-center justify-center"
                                            title="Librarian Admin Login"
                                        >
                                            <i className="fa-solid fa-user-shield"></i>
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* DEDICATED NAVIGATION BAR */}
                            {/* MOBILE NAVIGATION BAR (< 768px): Icon-only Hamburger Menu button on the LEFT */}
                            <div className="block md:hidden relative w-full pt-1">
                                <div className="flex items-center justify-start">
                                    <button 
                                        onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                                        aria-expanded={isMobileMenuOpen}
                                        aria-label="Toggle Navigation Menu"
                                        className="px-3.5 py-2.5 min-h-[44px] min-w-[44px] bg-sky-900/90 hover:bg-sky-700 text-amber-300 rounded-xl border-2 border-sky-400/80 hover:border-amber-400 flex items-center justify-center transition-all shadow-sm active:scale-95"
                                    >
                                        <i className={`fa-solid ${isMobileMenuOpen ? 'fa-xmark' : 'fa-bars'} text-lg`}></i>
                                    </button>
                                </div>

                                {/* BACKDROP OVERLAY TO CLOSE MENU WHEN TAPPING OUTSIDE */}
                                {isMobileMenuOpen && (
                                    <div 
                                        className="fixed inset-0 z-40 bg-slate-950/30 backdrop-blur-[1px]" 
                                        onClick={() => setIsMobileMenuOpen(false)}
                                    ></div>
                                )}

                                {/* MOBILE DROPDOWN MENU PANEL WITH ALL 5 OPTIONS */}
                                {isMobileMenuOpen && (
                                    <div className="absolute left-0 right-0 mt-2 p-2.5 bg-slate-900/95 border-2 border-sky-500 rounded-2xl shadow-2xl z-50 space-y-2 animate-slide-down backdrop-blur-md">
                                        <button 
                                            onClick={() => { setActiveView('HOME'); setIsMobileMenuOpen(false); }}
                                            className={`w-full px-4 py-2.5 rounded-xl border text-xs font-extrabold flex items-center justify-between transition-all min-h-[44px] ${activeView === 'HOME' ? 'bg-amber-500 text-slate-950 border-amber-400 shadow' : 'bg-sky-950/80 text-sky-100 border-sky-700 hover:border-amber-400'}`}
                                        >
                                            <div className="flex items-center space-x-2.5">
                                                <i className="fa-solid fa-house text-xs"></i>
                                                <span>{t('navHome')}</span>
                                            </div>
                                            <i className="fa-solid fa-chevron-right text-[10px] text-sky-400"></i>
                                        </button>

                                        <button 
                                            onClick={() => { setActiveView('TOTAL_BOOKS'); setIsMobileMenuOpen(false); }}
                                            className={`w-full px-4 py-2.5 rounded-xl border text-xs font-extrabold flex items-center justify-between transition-all min-h-[44px] ${activeView === 'TOTAL_BOOKS' ? 'bg-amber-500 text-slate-950 border-amber-400 shadow' : 'bg-sky-950/80 text-sky-100 border-sky-700 hover:border-amber-400'}`}
                                        >
                                            <div className="flex items-center space-x-2.5">
                                                <i className="fa-solid fa-book text-xs"></i>
                                                <span>{t('navTotal')}</span>
                                            </div>
                                            <span className="px-2 py-0.5 rounded-md text-[10px] font-black bg-sky-900 text-amber-300 border border-amber-400/40 shrink-0 whitespace-nowrap">{totalBookCount}</span>

                                                                <span className="px-2 py-0.5 bg-red-600 text-white rounded-full text-[10px] font-black animate-pulse shadow">
                                                                    {badgeCount} NEW UPDATE

                                                            )}

                                                        <p className="text-slate-600 dark:text-slate-400 text-xs font-semibold mb-4 truncate">{ch.handle}</p>
                                                    </div>

                                                    <a 
                                                        href={ch.url}
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        className={`w-full py-2.5 px-3 rounded-xl font-black text-xs text-center flex items-center justify-center space-x-2 shadow-md transition-all ${ch.color}`}

                                                        <span className="truncate">{ch.name}</span>
                                                        <i className="fa-solid fa-arrow-up-right-from-square text-[10px] shrink-0"></i>
                                                    </a>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                            </div>

                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}

                                        <div className="flex flex-wrap items-center gap-2">
                                            <select 
                                                value={categoryFilter}

                                                <option value="ALL">{t('allCategories')}</option>
                                                <option value="Literature">Literature</option>
                                                <option value="Philosophy">Philosophy</option>
                                                <option value="Fiction">Fiction</option>
                                                <option value="Self Help">Self Help</option>
                                                <option value="Biography">Biography</option>
                                                <option value="History">History</option>
                                                <option value="Poetry">Poetry</option>
                                            </select>

                                            <select 
                                                value={mediumFilter}
                                                onChange={(e) => setMediumFilter(e.target.value)}

                                                <option value="ALL">{t('allLanguages')}</option>

                                                <option value="Hindi">Hindi</option>
                                            </select>

                                                value={sortOption}
                                                onChange={(e) => setSortOption(e.target.value)}
                                                className="px-3 py-2 rounded-xl border border-sky-300 dark:border-sky-800 bg-white dark:bg-slate-950 text-xs font-bold text-slate-800 dark:text-slate-200"
                                            >
                                                <option value="SERIAL_ASC">{t('sortSerialAsc')}</option>
                                                <option value="SERIAL_DESC">{t('sortSerialDesc')}</option>
                                                <option value="A-Z">{t('sortAZ')}</option>
                                                <option value="Z-A">{t('sortZA')}</option>
                                            </select>

                                            {/* GRID / TABLE TOGGLE */}
                                            <div className="flex border border-sky-300 dark:border-sky-800 rounded-xl overflow-hidden p-0.5 bg-sky-100 dark:bg-slate-950">
                                                <button 
                                                    onClick={() => setViewMode('GRID')}
                                                    className={`p-2 text-xs rounded-lg font-bold transition-all ${viewMode === 'GRID' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 dark:text-slate-400'}`}
                                                    title={t('viewGrid')}
                                                >
                                                    <i className="fa-solid fa-border-all"></i>
                                                </button>
                                                <button 
                                                    onClick={() => setViewMode('TABLE')}
                                                    className={`p-2 text-xs rounded-lg font-bold transition-all ${viewMode === 'TABLE' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-600 dark:text-slate-400'}`}
                                                    title={t('viewTable')}
                                                >
                                                    <i className="fa-solid fa-list"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* CATALOG GRID VIEW */}
                                {viewMode === 'GRID' ? (
                                    <div className="grid grid-cols-1 xs:grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">

                                            <div key={b.id} className={`p-4 rounded-2xl border-2 shadow hover:shadow-lg transition-all flex flex-col justify-between ${darkMode ? 'bg-slate-900 border-sky-900' : 'bg-white border-sky-200'}`}>
                                                <div>
                                                    <div className="flex justify-between items-center text-[10px] font-black uppercase text-amber-600 dark:text-amber-400 border-b pb-1.5 mb-2 border-sky-100 dark:border-sky-900">
                                                        <span>Book #{b.id}</span>
                                                        <span className={`px-2 py-0.5 rounded-full ${b.status === 'Available' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'}`}>
                                                            {b.status}
                                                        </span>
                                                    </div>
                                                    <h4 className="font-extrabold text-sm text-sky-950 dark:text-sky-100 line-clamp-2 mb-1">{b.title}</h4>
                                                    <p className="text-slate-600 dark:text-slate-400 text-xs font-semibold mb-2">{b.author}</p>
                                                    <div className="flex items-center space-x-2 text-[10px] font-bold text-slate-500">
                                                        <span className="bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 px-2 py-0.5 rounded">{b.category}</span>
                                                        <span className="bg-amber-50 dark:bg-amber-950 text-amber-800 dark:text-amber-300 px-2 py-0.5 rounded">{b.medium}</span>
                                                    </div>
                                                </div>
                                                <button 
                                                    disabled={b.status === 'Issued'}
                                                    onClick={() => {
                                                        setReqForm({ ...reqForm, bookId: b.id.toString() });
                                                        setActiveView('REQUISITION');
                                                    }}
                                                    className={`w-full mt-4 py-2 rounded-xl text-xs font-black shadow transition-all flex items-center justify-center space-x-1 ${b.status === 'Available' ? 'bg-sky-800 hover:bg-sky-900 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'}`}
                                                >
                                                    <i className="fa-solid fa-file-signature text-amber-400"></i>
                                                    <span>{b.status === 'Available' ? t('reqBtn') : 'Issued Out'}</span>
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    /* CATALOG TABLE VIEW */
                                    <div className="overflow-x-auto rounded-2xl border-2 border-sky-200 dark:border-sky-900 bg-white dark:bg-slate-900 shadow custom-scrollbar">
                                        <table className="w-full text-left text-xs font-semibold min-w-[600px]">
                                            <thead className="bg-sky-100 dark:bg-slate-950 text-sky-900 dark:text-amber-300 uppercase text-[10px] font-black border-b border-sky-200 dark:border-sky-900">

                                                    <th className="p-3">Book #</th>
                                                    <th className="p-3">Title</th>
                                                    <th className="p-3">Author</th>
                                                    <th className="p-3">Category</th>
                                                    <th className="p-3">Medium</th>
                                                    <th className="p-3">Status</th>
                                                    <th className="p-3 text-right">Action</th>
                                                </tr>
                                            </thead>

                                                    <tr key={b.id} className="hover:bg-sky-50 dark:hover:bg-slate-800/50">
                                                        <td className="p-3 font-black text-amber-600 dark:text-amber-400">#{b.id}</td>
                                                        <td className="p-3 font-bold text-sky-950 dark:text-sky-100">{b.title}</td>
                                                        <td className="p-3 text-slate-600 dark:text-slate-400">{b.author}</td>
                                                        <td className="p-3">{b.category}</td>
                                                        <td className="p-3">{b.medium}</td>
                                                        <td className="p-3">
                                                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-black ${b.status === 'Available' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300'}`}>
                                                                {b.status}
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-right">
                                                            <button 
                                                                disabled={b.status === 'Issued'}
                                                                onClick={() => {
                                                                    setReqForm({ ...reqForm, bookId: b.id.toString() });
                                                                    setActiveView('REQUISITION');
                                                                }}
                                                                className={`px-3 py-1.5 rounded-lg text-xs font-black shadow transition-all ${b.status === 'Available' ? 'bg-sky-800 hover:bg-sky-900 text-white' : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'}`}
                                                            >
                                                                {t('reqBtn')}
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                {/* PAGINATION CONTROLS */}
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 pt-2">
                                    <div className="text-xs font-extrabold text-slate-500">
                                        {t('showingVolumes')} {filteredBooks.length > 0 ? (currentPage - 1) * pageSize + 1 : 0} - {Math.min(currentPage * pageSize, filteredBooks.length)} {t('ofVolumes')} {filteredBooks.length} {t('volumesText')}

                                        <button 
                                            disabled={currentPage === 1}

                                            Previous

                                        <span className="px-3 py-1.5 bg-amber-500 text-slate-950 rounded-xl text-xs font-black">{currentPage} / {totalPages}</span>
                                        <button 
                                            disabled={currentPage === totalPages}
                                            onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                                            className="px-3 py-1.5 rounded-xl border border-sky-300 dark:border-sky-800 text-xs font-bold disabled:opacity-40"
                                        >
                                            Next
                                        </button>
                                    </div>
                                </div>

                            </div>
                        )}

                        {}
                        {/* REQUISITION FORM VIEW */}
                        {activeView === 'REQUISITION' && (
                            <div className="max-w-2xl mx-auto animate-slide-down">
                                <div className={`p-5 sm:p-8 rounded-3xl border-2 shadow-xl ${darkMode ? 'bg-slate-900 border-sky-900' : 'bg-white border-sky-200'}`}>
                                    <h3 className="font-cinzel font-black text-lg sm:text-xl text-sky-950 dark:text-amber-400 border-b pb-3 mb-2 flex items-center space-x-2">
                                        <i className="fa-solid fa-file-signature text-red-600"></i>
                                        <span>{t('reqFormTitle')}</span>
                                    </h3>
                                    <p className="text-xs text-slate-500 font-semibold mb-6">{t('reqFormSub')}</p>

                                    <form onSubmit={handleRequisitionSubmit} className="space-y-4 text-xs font-bold">
                                        <div>
                                            <label className="block mb-1 text-slate-700 dark:text-sky-200">{t('selectBook')} *</label>
                                            <select 
                                                value={reqForm.bookId}
                                                onChange={(e) => setReqForm({ ...reqForm, bookId: e.target.value })}
                                                className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-amber-400"
                                                required
                                            >
                                                <option value="">{t('chooseVolume')}</option>
                                                {books.map(b => (
                                                    <option key={b.id} value={b.id} disabled={b.status === 'Issued'}>
                                                        #{b.id} - {b.title} ({b.author}) {b.status === 'Issued' ? '[ISSUED OUT]' : ''}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block mb-1 text-slate-700 dark:text-sky-200">{t('empName')} *</label>
                                                <input 
                                                    type="text" 
                                                    value={reqForm.empName}
                                                    onChange={(e) => setReqForm({ ...reqForm, empName: e.target.value })}
                                                    placeholder="Example: Ravi Kumar"
                                                    className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-amber-400"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="block mb-1 text-slate-700 dark:text-sky-200">{t('empId')} *</label>
                                                <input 
                                                    type="text" 
                                                    value={reqForm.empId}
                                                    onChange={(e) => setReqForm({ ...reqForm, empId: e.target.value })}
                                                    placeholder="Example: DLGPO12345"
                                                    className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-amber-400"
                                                    required
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block mb-1 text-slate-700 dark:text-sky-200">{t('cadre')}</label>
                                                <input 
                                                    type="text" 
                                                    value={reqForm.cadre}
                                                    onChange={(e) => setReqForm({ ...reqForm, cadre: e.target.value })}
                                                    placeholder="Example: Postal Assistant"
                                                    className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-amber-400"
                                                />
                                            </div>
                                            <div>
                                                <label className="block mb-1 text-slate-700 dark:text-sky-200">{t('branch')}</label>
                                                <input 
                                                    type="text" 
                                                    value={reqForm.branch}
                                                    onChange={(e) => setReqForm({ ...reqForm, branch: e.target.value })}
                                                    placeholder="Example: Delivery Branch"
                                                    className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-amber-400"
                                                />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block mb-1 text-slate-700 dark:text-sky-200">{t('mobile')} (10 digits) *</label>
                                                <input 
                                                    type="tel" 
                                                    inputMode="numeric"
                                                    maxLength="10"
                                                    value={reqForm.mobile}
                                                    onChange={(e) => setReqForm({ ...reqForm, mobile: e.target.value.replace(/\D/g, '').slice(0, 10) })}
                                                    placeholder="Example: 9876543210"
                                                    className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-amber-400"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="block mb-1 text-slate-700 dark:text-sky-200">{t('email')}</label>
                                                <input 
                                                    type="email" 
                                                    value={reqForm.email}
                                                    onChange={(e) => setReqForm({ ...reqForm, email: e.target.value })}
                                                    placeholder="Example: ravi.kumar@example.com"
                                                    className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-amber-400"
                                                />
                                            </div>
                                        </div>

                                        <button 
                                            type="submit" 
                                            className="w-full py-3.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow-md text-sm transition-all mt-4 border border-amber-300 flex items-center justify-center space-x-2"
                                        >
                                            <i className="fa-solid fa-paper-plane"></i>
                                            <span>{t('submitReqBtn')}</span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* ADMIN CONTROL PANEL */}
                        {activeView === 'ADMIN_PANEL' && isAdminLoggedIn && (
                            <div className="space-y-6 animate-slide-down">
                                <div className={`p-5 sm:p-6 rounded-2xl border-2 shadow-lg ${darkMode ? 'bg-slate-900 border-sky-900' : 'bg-white border-sky-200'}`}>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 mb-6 border-sky-200 dark:border-sky-800 gap-3">
                                        <div>
                                            <h3 className="font-cinzel font-extrabold text-lg sm:text-xl text-sky-950 dark:text-amber-400 flex items-center space-x-2">
                                                <i className="fa-solid fa-user-shield text-red-600"></i>
                                                <span>{t('adminControlDesk')}</span>
                                            </h3>
                                        </div>
                                        <button 
                                            onClick={() => { setIsAdminLoggedIn(false); setActiveView('HOME'); showToast("Logged out of Admin Portal."); }}
                                            className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl shadow transition-all"
                                        >
                                            <i className="fa-solid fa-right-from-bracket mr-1"></i> {t('logoutBtn')}
                                        </button>
                                    </div>

                                    {/* PENDING REQUISITIONS */}
                                    <div className="space-y-4 mb-8">

                                            <i className="fa-solid fa-clock-rotate-left"></i>
                                            <span>{t('pendingReqs')} ({pendingReqCount})</span>

                                        {requisitions.filter(r => r.status === 'PENDING').length === 0 ? (

                                                {t('noPending')}
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {requisitions.filter(r => r.status === 'PENDING').map(r => (
                                                    <div key={r.id} className="p-4 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs font-bold">
                                                        <div>
                                                            <div className="text-amber-600 dark:text-amber-400 font-extrabold">Book #{r.bookId}: {r.bookTitle}</div>
                                                            <div className="text-slate-800 dark:text-slate-200">Member: {r.empName} ({r.empId}) • Mobile: {r.mobile}</div>
                                                            <div className="text-slate-400 text-[10px]">Requested: {r.requestDate}</div>
                                                        </div>
                                                        <div className="flex space-x-2 shrink-0">
                                                            <button onClick={() => handleApproveReq(r.id)} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold">
                                                                {t('approveBtn')}
                                                            </button>
                                                            <button onClick={() => handleRejectReq(r.id)} className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold">
                                                                {t('rejectBtn')}
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {/* GREETINGS & MARQUEE MANAGER */}
                                    <div className="p-4 sm:p-5 rounded-2xl border border-sky-200 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 space-y-4 mb-8">
                                        <h4 className="font-extrabold text-sm text-sky-900 dark:text-amber-300 flex items-center space-x-2">
                                            <i className="fa-solid fa-bullhorn text-amber-500"></i>
                                            <span>Special Marquee Greetings & Festive Messages Manager</span>
                                        </h4>
                                        <form onSubmit={handleAddNewGreeting} className="space-y-3 text-xs font-bold">
                                            <div>
                                                <label className="block mb-1">Special Greeting Text (IST Expiry):</label>
                                                <input 
                                                    type="text" 
                                                    value={newGreetingForm.text}
                                                    onChange={(e) => setNewGreetingForm({ ...newGreetingForm, text: e.target.value })}
                                                    placeholder="e.g. Delhi GPO – 110006 wishes all employees Happy Diwali!"
                                                    className="w-full p-2.5 rounded-xl border border-sky-300 dark:border-sky-800 bg-white dark:bg-slate-900"
                                                    required
                                                />

                                                    value={newGreetingForm.durationHours}
                                                    onChange={(e) => setNewGreetingForm({ ...newGreetingForm, durationHours: e.target.value })}

                                                    <option value="24">24 Hours</option>
                                                    <option value="48">48 Hours</option>
                                                </select>
