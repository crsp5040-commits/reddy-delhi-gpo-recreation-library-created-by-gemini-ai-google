        function AppDownloadPrompt({ apkUrl, apkLogoUrl }) {
            const [isOpen, setIsOpen] = useState(false);
            const [dontShowAgain, setDontShowAgain] = useState(false);

            useEffect(() => {
                const neverShow = safeStorage.getItem(APP_PROMPT_NEVER_SHOW_KEY) === 'true';
                const downloadClicked = safeStorage.getItem(APP_DOWNLOAD_CLICKED_KEY) === 'true';
                const snoozeUntilStr = safeStorage.getItem(APP_PROMPT_SNOOZE_UNTIL_KEY);
                const snoozeUntil = snoozeUntilStr ? parseInt(snoozeUntilStr, 10) : 0;

                if (neverShow || downloadClicked) return;
                if (Date.now() < snoozeUntil) return;

                const timer = setTimeout(() => {
                    setIsOpen(true);
                }, 1000);

                return () => clearTimeout(timer);
            }, []);

            if (!isOpen) return null;

            const handleCloseWithSnooze = () => {
                if (dontShowAgain) {
                    safeStorage.setItem(APP_PROMPT_NEVER_SHOW_KEY, 'true');
                } else {
                    const sevenDaysSnooze = Date.now() + (7 * 24 * 60 * 60 * 1000);
                    safeStorage.setItem(APP_PROMPT_SNOOZE_UNTIL_KEY, String(sevenDaysSnooze));
                }
                setIsOpen(false);
            };

            const handleDownloadApp = () => {
                safeStorage.setItem(APP_DOWNLOAD_CLICKED_KEY, 'true');
                if (dontShowAgain) {
                    safeStorage.setItem(APP_PROMPT_NEVER_SHOW_KEY, 'true');
                }
                setIsOpen(false);
                
                const targetUrl = apkUrl || FALLBACK_APK_URL;
                window.open(targetUrl, '_blank');
            };

            const handleAlreadyInstalled = () => {
                safeStorage.setItem(APP_PROMPT_NEVER_SHOW_KEY, 'true');
                setIsOpen(false);
            };

            return (
                <div 
                    role="dialog" 
                    aria-modal="true" 
                    aria-labelledby="app-prompt-title" 
                    aria-describedby="app-prompt-desc"
                    className="fixed inset-0 bg-slate-950/75 backdrop-blur-md z-[2000] flex items-center justify-center p-4 animate-slide-down"
                >
                    <div className="w-full max-w-[420px] bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-sky-300 dark:border-sky-800 relative text-slate-900 dark:text-slate-100">
                        <button 
                            onClick={handleCloseWithSnooze}
                            className="absolute top-4 right-4 w-9 h-9 rounded-full bg-sky-50 dark:bg-slate-800 text-slate-400 hover:text-slate-700 dark:hover:text-white flex items-center justify-center transition-all"
                            aria-label="Close prompt"
                        >
                            <i className="fa-solid fa-xmark text-lg"></i>
                        </button>

                        <div className="text-center pt-2 pb-4">
                            <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-800 via-sky-900 to-red-600 p-1 mx-auto shadow-lg mb-3 flex items-center justify-center">
                                <img 
                                    src={apkLogoUrl || FALLBACK_APK_LOGO_URL} 
                                    alt="Delhi GPO App Logo" 
                                    className="w-full h-full object-contain rounded-xl"
                                    onError={(e) => { e.target.src = FALLBACK_LOGO_URL; }}
                                />
                            </div>
                            <h3 id="app-prompt-title" className="font-cinzel font-black text-lg text-sky-950 dark:text-amber-400">
                                Get the Delhi GPO Library App
                            </h3>
                            <p id="app-prompt-desc" className="text-xs text-slate-600 dark:text-slate-300 font-semibold mt-1 px-2">
                                For faster access, instant updates, and a superior experience, download our official Android application.
                            </p>
                        </div>

                        <div className="mb-4 flex items-center justify-center space-x-2 bg-sky-50 dark:bg-slate-950 p-2.5 rounded-xl border border-sky-200 dark:border-sky-800">
                            <input 
                                type="checkbox" 
                                id="dontShowPromptAgain" 
                                checked={dontShowAgain}
                                onChange={(e) => setDontShowAgain(e.target.checked)}
                                className="w-4 h-4 text-sky-600 rounded cursor-pointer"
                            />
                            <label htmlFor="dontShowPromptAgain" className="text-xs font-bold text-slate-700 dark:text-slate-300 cursor-pointer">
                                Don't show this prompt again
                            </label>
                        </div>

                        <div className="space-y-2.5">
                            <button 
                                onClick={handleDownloadApp}
                                className="w-full min-h-[46px] bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-black text-xs rounded-xl shadow-md flex items-center justify-center space-x-2 transition-all"
                            >
                                <i className="fa-solid fa-download text-sm"></i>
                                <span>Download App (.APK)</span>
                            </button>

                            <button 
                                onClick={handleAlreadyInstalled}
                                className="w-full min-h-[44px] bg-sky-100 dark:bg-slate-800 hover:bg-sky-200 dark:hover:bg-slate-700 text-sky-900 dark:text-sky-100 font-bold text-xs rounded-xl flex items-center justify-center space-x-2 transition-all"
                            >
                                <i className="fa-solid fa-circle-check text-emerald-600 dark:text-emerald-400"></i>
                                <span>Already Installed</span>
                            </button>

                            <button 
                                onClick={handleCloseWithSnooze}
                                className="w-full min-h-[40px] text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 font-bold text-xs rounded-xl transition-all"
                            >
                                Maybe Later
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

            // RESET PAGINATION PAGE WHEN SEARCH OR FILTER CHANGES

            useEffect(() => {

                window.addEventListener('keydown', handleEscape);

            const fetchDatabaseData = async () => {

                        if (error) throw error;

                    book_id: targetBook.id,

                            issued_member_id: manualIssueForm.memberId,
                            issued_at: nowIso,
                            due_date: manualIssueForm.dueDate || null
                        }).eq('id', targetBook.id);
                    }

                    // Fallback / local sync update
                    setBooks(prev => prev.map(b => b.id === targetBook.id ? { ...b, status: 'Issued', issued_to: issuedToText } : b));
                    showToast(`Book #${targetBook.id} successfully issued to ${manualIssueForm.memberName}.`, "success");
                    setManualIssueForm({ bookId: '', memberName: '', memberId: '', mobile: '', email: '', dueDate: '', notes: '' });
                    fetchDatabaseData();
                } catch(err) {
                    showToast("Manual issue failed: " + err.message, "error");
                }
            };

            const handleApproveAndIssue = async (reqItem) => {
                const targetBook = books.find(b => b.id.toString() === reqItem.book_id.toString());
                if (!targetBook || targetBook.status !== 'Available') {
                    showToast("This volume is no longer available for issue.", "error");
                    return;
                }

                const nowIso = new Date().toISOString();
                const issuedToText = `${reqItem.emp_name} (${reqItem.emp_id})`;

                try {
                    if (supabaseClient) {
                        await supabaseClient.from('book_transactions').insert([{
                            book_id: targetBook.id,
                            requisition_id: reqItem.id,
                            member_name: reqItem.emp_name,
                            member_id: reqItem.emp_id,
                            member_mobile: reqItem.mobile,
                            member_email: reqItem.email,
                            issue_mode: 'ONLINE_REQUEST',
                            transaction_status: 'ISSUED',
                            issued_at: nowIso,
                            issued_by: 'ADMIN_LIBRARIAN'
                        }]);

                        await supabaseClient.from('requisitions').update({
                            status: 'ISSUED',
                            approved_at: nowIso,
                            issued_at: nowIso,
                            issue_mode: 'ONLINE_REQUEST'
                        }).eq('id', reqItem.id);

                        await supabaseClient.from('books').update({
                            status: 'Issued',
                            issued_to: issuedToText,
                            issued_member_id: reqItem.emp_id,
                            issued_at: nowIso
                        }).eq('id', targetBook.id);
                    }

                    // Local state fallback update
                    setRequisitions(prev => prev.map(r => r.id === reqItem.id ? { ...r, status: 'ISSUED' } : r));
                    setBooks(prev => prev.map(b => b.id === targetBook.id ? { ...b, status: 'Issued', issued_to: issuedToText } : b));
                    showToast(`Online request approved. Book #${targetBook.id} issued!`, "success");
                    fetchDatabaseData();
                } catch(err) {
                    showToast("Approve and issue failed: " + err.message, "error");
                }
            };

            const handleRejectReq = async (reqId) => {
                try {
                    if (supabaseClient) {
                        await supabaseClient.from('requisitions').update({ status: 'REJECTED' }).eq('id', reqId);
                    }
                    setRequisitions(prev => prev.map(r => r.id === reqId ? { ...r, status: 'REJECTED' } : r));
                    showToast("Requisition request rejected.", "error");
                    fetchDatabaseData();
                } catch(err) {
                    showToast("Reject action failed: " + err.message, "error");
                }
            };

            const handleReturnBook = async (bookId) => {
                try {
                    const nowIso = new Date().toISOString();

                    if (supabaseClient) {
                        const { data: activeTrans } = await supabaseClient.from('book_transactions')
                            .select('*')
                            .eq('book_id', bookId)
                            .eq('transaction_status', 'ISSUED')
                            .limit(1);

                        if (activeTrans && activeTrans.length > 0) {
                            const trans = activeTrans[0];
                            await supabaseClient.from('book_transactions').update({
                                transaction_status: 'RETURNED',
                                returned_at: nowIso,
                                returned_by: 'ADMIN_LIBRARIAN'
                            }).eq('id', trans.id);

                            if (trans.requisition_id) {
                                await supabaseClient.from('requisitions').update({
                                    status: 'RETURNED',
                                    returned_at: nowIso
                                }).eq('id', trans.requisition_id);
                            }
                        }

                        await supabaseClient.from('books').update({
                            status: 'Available',
                            issued_to: '',
                            issued_member_id: null,
                            issued_at: null,
                            due_date: null
                        }).eq('id', bookId);
                    }

                    // Local state sync update
                    setBooks(prev => prev.map(b => b.id === bookId ? { ...b, status: 'Available', issued_to: '' } : b));
                    showToast(`Book #${bookId} physically returned and set to Available!`, "success");
                    fetchDatabaseData();
                } catch(err) {
                    showToast("Book return failed: " + err.message, "error");
                }
            };

            const handleSaveBook = async (e) => {

                    return;

                try {

                        // Edit existing book

                            await supabaseClient.from('books').update({

                                title: bookForm.title,
                                author: bookForm.author,
                                category: bookForm.category,
                                medium: bookForm.medium
                            }).eq('id', editingBook.id);
                        }
                        setBooks(prev => prev.map(b => b.id === editingBook.id ? { ...b, ...bookForm } : b));
                        showToast("Book updated successfully!", "success");
                    } else {

                        const newId = books.length > 0 ? Math.max(...books.map(b => b.id)) + 1 : 1;
                        const newBook = {

                            accession_no: bookForm.accession_no,

                            author: bookForm.author,
                            category: bookForm.category,

                            issued_to: ''

                        if (supabaseClient) {
                            await supabaseClient.from('books').insert([newBook]);
                        }
                        setBooks(prev => [...prev, newBook]);
                        showToast("New book added to catalog!", "success");
                    }

                    setEditingBook(null);
                    setBookForm({ accession_no: '', title: '', author: '', category: 'Literature', medium: 'English' });
                    fetchDatabaseData();
                } catch(err) {
                    showToast("Book save failed: " + err.message, "error");
                }
            };

            // PAPAPARSE CSV EXPORT & IMPORT
            const exportBooksToCSV = () => {
                if (!window.Papa) {
                    showToast("PapaParse library not ready.", "error");
                    return;
                }
                const csv = window.Papa.unparse(books);
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `Delhi_GPO_Catalog_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("Catalog exported to CSV!", "success");
            };

                if (!window.Papa) {

                const file = e.target.files[0];

                window.Papa.parse(file, {
                    header: true,

                    complete: async (results) => {
                        if (results.data && results.data.length > 0) {
                            const importedBooks = results.data.map((row, idx) => ({
                                id: parseInt(row.id, 10) || (books.length + idx + 1),
                                accession_no: row.accession_no || `ACC-${String(books.length + idx + 1).padStart(3, '0')}`,
                                title: row.title || 'Untitled',
                                author: row.author || 'Unknown',
                                category: row.category || 'General',
                                medium: row.medium || 'English',
                                status: row.status || 'Available',
                                issued_to: row.issued_to || ''
                            }));

                            if (supabaseClient) {
                                try {
                                    await supabaseClient.from('books').upsert(importedBooks);
                                } catch(e) {
                                    console.warn("Bulk upsert notice:", e);
                                }
                            }

                            setBooks(importedBooks);
                            showToast(`Successfully imported ${importedBooks.length} books from CSV!`, "success");
                        } else {
                            showToast("No valid rows found in CSV file.", "error");
                        }
                    }
                });
            };

                return books.filter(b => {

                                                    <div key={r.id} className="p-4 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs font-bold">
                                                        <div>
                                                            <div className="text-amber-600 dark:text-amber-400 font-extrabold">Book #{r.book_id}: {r.book_title}</div>
                                                            <div className="text-slate-800 dark:text-slate-200">Employee: {r.emp_name} ({r.emp_id}) • Mobile: {r.mobile}</div>
                                                            <div className="text-slate-400 text-[10px]">Status: <span className="uppercase text-amber-500 font-black">{r.status}</span> • Requested: {r.request_date}</div>
                                                        </div>
                                                        {r.status === 'PENDING' && (
                                                            <div className="flex space-x-2 shrink-0 w-full sm:w-auto">
                                                                <button onClick={() => handleApproveAndIssue(r)} className="flex-1 sm:flex-none px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow">
                                                                    Approve & Issue
                                                                </button>
                                                                <button onClick={() => handleRejectReq(r.id)} className="flex-1 sm:flex-none px-3 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-extrabold shadow">
                                                                    Reject
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    {/* 3. ISSUED BOOKS DESK */}
                                    <div className="space-y-4 mb-8">
                                        <h4 className="font-bold text-sm text-sky-900 dark:text-sky-200 flex items-center space-x-2">
                                            <i className="fa-solid fa-book-bookmark text-emerald-500"></i>
                                            <span>Currently Issued Books & Physical Return Management</span>
                                        </h4>
                                        <div className="space-y-3">
                                            {books.filter(b => b.status === 'Issued').length === 0 ? (
                                                <div className="p-4 bg-sky-50 dark:bg-slate-950 rounded-xl text-center text-xs font-bold text-slate-500">No volumes currently issued.</div>
                                            ) : (
                                                books.filter(b => b.status === 'Issued').map(b => (
                                                    <div key={b.id} className="p-4 rounded-xl border border-amber-300 dark:border-amber-900/50 bg-amber-50/40 dark:bg-slate-950 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs font-bold">
                                                        <div>
                                                            <div className="text-sky-950 dark:text-amber-400 font-black text-sm">#{b.id} ({b.accession_no}) - {b.title}</div>
                                                            <div className="text-slate-700 dark:text-slate-300">Issued To: <span className="text-red-600 dark:text-red-400 font-black">{b.issued_to || 'N/A'}</span></div>
                                                        </div>
                                                        <div className="flex items-center space-x-2 shrink-0">
                                                            <button 
                                                                onClick={() => setSelectedHistoryBook(b)}
                                                                className="px-3 py-2 bg-sky-800 hover:bg-sky-900 text-white rounded-xl text-xs font-bold shadow"
                                                            >
                                                                History
                                                            </button>
                                                            <button 
                                                                onClick={() => handleReturnBook(b.id)}
                                                                className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-black shadow"
                                                            >
                                                                Mark Returned & Available
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>

                                    {/* 4. COMPLETE BOOK MANAGEMENT CATALOG TABLE */}
                                    <div className="space-y-4">
                                        <h4 className="font-bold text-sm text-sky-900 dark:text-sky-200 flex items-center space-x-2">
                                            <i className="fa-solid fa-books text-amber-500"></i>
                                            <span>Catalog Database Editor ({books.length} Books Total)</span>
                                        </h4>
                                        <div className="overflow-x-auto border border-sky-200 dark:border-sky-800 rounded-xl">
                                            <table className="w-full text-left text-xs">
                                                <thead className="bg-sky-100 dark:bg-slate-950 text-sky-900 dark:text-amber-400 font-black">
                                                    <tr>
                                                        <th className="p-3">#</th>
                                                        <th className="p-3">Accession No</th>
                                                        <th className="p-3">Title</th>
                                                        <th className="p-3">Author</th>
                                                        <th className="p-3">Category</th>
                                                        <th className="p-3">Status</th>
                                                        <th className="p-3 text-right">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-sky-100 dark:divide-slate-800 font-bold">
                                                    {books.map(b => (
                                                        <tr key={b.id} className="hover:bg-sky-50/50 dark:hover:bg-slate-800/50">
                                                            <td className="p-3 font-mono">#{b.id}</td>
                                                            <td className="p-3 font-mono">{b.accession_no}</td>
                                                            <td className="p-3 font-extrabold text-sky-950 dark:text-sky-100">{b.title}</td>
                                                            <td className="p-3 text-slate-500">{b.author}</td>
                                                            <td className="p-3">{b.category}</td>
                                                            <td className="p-3">
                                                                <span className={`px-2 py-0.5 rounded-full text-[10px] uppercase font-black ${b.status === 'Available' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                                                    {b.status}
                                                                </span>
                                                            </td>
                                                            <td className="p-3 text-right space-x-1.5">
                                                                <button 
                                                                    onClick={() => { setEditingBook(b); setBookForm({ accession_no: b.accession_no, title: b.title, author: b.author, category: b.category, medium: b.medium }); }}
                                                                    className="px-2.5 py-1 bg-sky-800 text-white rounded-lg text-[11px]"
                                                                    title="Edit Book"
                                                                >
                                                                    <i className="fa-solid fa-pen-to-square"></i>
                                                                </button>
                                                                <button 
                                                                    onClick={() => handleDeleteBook(b.id)}
                                                                    className="px-2.5 py-1 bg-red-600 text-white rounded-lg text-[11px]"
                                                                    title="Delete Book"
                                                                >
                                                                    <i className="fa-solid fa-trash"></i>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}

                    </main>

                    {}
                    <footer className="mt-auto bg-sky-950 text-sky-300 py-6 text-center text-xs font-bold border-t-4 border-amber-400 w-full">
                        <div className="max-w-7xl mx-auto px-4 space-y-2">
                            <p>© 2026 Delhi GPO – 110006. Department of Posts • Government of India.</p>
                            <p className="text-[10px] text-sky-400">Serving postal employees & members with honor, knowledge, and pride.</p>
                            <div className="pt-2">
                                <button 
                                    onClick={() => { setShowAuthModal(true); setAuthTab('login'); setAuthMessage(''); }} 
                                    className="text-amber-400 hover:text-amber-300 underline font-extrabold cursor-pointer text-xs"
                                >
                                    Librarian Admin Login
                                </button>
                            </div>
                        </div>
                    </footer>

                    {/* ADD / EDIT BOOK MODAL */}
                    {editingBook !== null && (
                        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-sky-300 dark:border-sky-800 relative text-slate-900 dark:text-slate-100">
                                <button onClick={() => setEditingBook(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="font-cinzel font-black text-lg text-sky-950 dark:text-amber-400 mb-1">
                                    {editingBook.id ? `Edit Book #${editingBook.id}` : 'Add New Book to Catalog'}
                                </h3>
                                <p className="text-xs text-slate-500 font-bold mb-4">Enter book attributes below to save to Supabase catalog.</p>
                                
                                <form onSubmit={handleSaveBook} className="space-y-3 text-xs font-bold">
                                    <div>
                                        <label className="block mb-1">Accession No *</label>
                                        <input 
                                            type="text" 
                                            value={bookForm.accession_no} 
                                            onChange={(e) => setBookForm({ ...bookForm, accession_no: e.target.value })}
                                            className="w-full p-2.5 rounded-xl border dark:bg-slate-950" 
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block mb-1">Book Title *</label>
                                        <input 
                                            type="text" 
                                            value={bookForm.title} 
                                            onChange={(e) => setBookForm({ ...bookForm, title: e.target.value })}
                                            className="w-full p-2.5 rounded-xl border dark:bg-slate-950" 
                                            required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block mb-1">Author Name *</label>
                                        <input 
                                            type="text" 
                                            value={bookForm.author} 
                                            onChange={(e) => setBookForm({ ...bookForm, author: e.target.value })}
                                            className="w-full p-2.5 rounded-xl border dark:bg-slate-950" 
                                            required 
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block mb-1">Category</label>
                                            <input 
                                                type="text" 
                                                value={bookForm.category} 
                                                onChange={(e) => setBookForm({ ...bookForm, category: e.target.value })}
                                                className="w-full p-2.5 rounded-xl border dark:bg-slate-950" 
                                            />
                                        </div>
                                        <div>
                                            <label className="block mb-1">Medium / Language</label>
                                            <input 
                                                type="text" 
                                                value={bookForm.medium} 
                                                onChange={(e) => setBookForm({ ...bookForm, medium: e.target.value })}
                                                className="w-full p-2.5 rounded-xl border dark:bg-slate-950" 
                                            />
                                        </div>
                                    </div>
                                    <div className="pt-2 flex justify-end space-x-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setEditingBook(null)}
                                            className="px-4 py-2 bg-slate-200 dark:bg-slate-800 rounded-xl font-bold"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow"
                                        >
                                            Save Book
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* HISTORY LOG MODAL */}
                    {selectedHistoryBook && (
                        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-sky-300 dark:border-sky-800 relative">
                                <button onClick={() => setSelectedHistoryBook(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <h3 className="font-cinzel font-black text-base text-sky-950 dark:text-amber-400 mb-1">
                                    Transaction History: #{selectedHistoryBook.id} - {selectedHistoryBook.title}
                                </h3>
                                <p className="text-xs text-slate-500 font-semibold mb-4">Complete issue/return log from database records.</p>
                                
                                <div className="max-h-80 overflow-y-auto space-y-2 text-xs font-bold">
                                    {bookTransactions.filter(t => t.book_id === selectedHistoryBook.id).length === 0 ? (
                                        <div className="p-4 bg-sky-50 dark:bg-slate-950 rounded-xl text-center text-slate-400">No transaction logs recorded yet.</div>
                                    ) : (
                                        bookTransactions.filter(t => t.book_id === selectedHistoryBook.id).map(t => (
                                            <div key={t.id} className="p-3 rounded-xl border border-sky-200 dark:border-sky-800 bg-sky-50/60 dark:bg-slate-950 flex justify-between items-center">
                                                <div>
                                                    <div className="text-amber-600 dark:text-amber-400 font-extrabold">Member: {t.member_name} ({t.member_id})</div>
                                                    <div className="text-[10px] text-slate-500">Mode: {t.issue_mode} • Issued: {new Date(t.issued_at).toLocaleDateString()}</div>
                                                </div>
                                                <span className={`px-2 py-1 rounded text-[10px] uppercase font-black ${t.transaction_status === 'ISSUED' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                                                    {t.transaction_status}
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ADMIN AUTH MODAL */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border-2 border-sky-300 dark:border-sky-800 relative">
                                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="text-center mb-4">
                                    <div className="w-12 h-12 bg-amber-500 text-slate-950 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl shadow">
                                        <i className="fa-solid fa-user-shield"></i>
                                    </div>
                                    <h3 className="font-cinzel font-black text-lg text-sky-950 dark:text-amber-400">Librarian Admin Control</h3>
                                </div>

                                <div className="flex border-b border-slate-200 dark:border-slate-800 mb-4">
                                    <button 
                                        onClick={() => { setAuthTab('login'); setAuthMessage(''); }} 
                                        className={`flex-1 py-2 text-xs font-black border-b-2 ${authTab === 'login' ? 'border-amber-500 text-amber-600 dark:text-amber-400' : 'border-transparent text-slate-400'}`}
                                    >
                                        Admin Login
                                    </button>
                                    <button 
                                        onClick={() => { setAuthTab('setup'); setAuthMessage(''); }} 
                                        className={`flex-1 py-2 text-xs font-black border-b-2 ${authTab === 'setup' ? 'border-amber-500 text-amber-600 dark:text-amber-400' : 'border-transparent text-slate-400'}`}
                                    >
                                        Set / Reset Password
                                    </button>
                                </div>

                                {authMessage && (
                                    <div className="p-3 mb-3 text-xs rounded-xl bg-red-100 dark:bg-red-950/80 text-red-700 dark:text-red-300 font-bold">
                                        {authMessage}
                                    </div>
                                )}

                                {authTab === 'login' ? (
                                    <form onSubmit={handleAdminLogin} className="space-y-4 text-xs font-bold">
                                        <div>
                                            <label className="block mb-1 text-slate-700 dark:text-sky-200">Admin Email:</label>
                                            <input 
                                                type="email" 
                                                value={authEmail} 
                                                onChange={(e) => setAuthEmail(e.target.value)} 
                                                className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block mb-1 text-slate-700 dark:text-sky-200">Password:</label>
                                            <input 
                                                type="password" 
                                                value={authPassword} 
                                                onChange={(e) => setAuthPassword(e.target.value)} 
                                                className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950" 
                                                required 
                                            />
                                        </div>
                                        <button 
                                            type="submit" 
                                            disabled={authLoading}
                                            className="w-full py-3 bg-sky-800 hover:bg-sky-900 text-white font-black rounded-xl shadow transition-all disabled:opacity-50"
                                        >
                                            {authLoading ? 'Authenticating...' : 'Login to Admin Desk'}
                                        </button>
                                    </form>
                                ) : (
                                    <form onSubmit={handleSetPassword} className="space-y-4 text-xs font-bold">
                                        <div>
                                            <label className="block mb-1 text-slate-700 dark:text-sky-200">Admin Email:</label>
                                            <input 
                                                type="email" 
                                                value={authEmail} 
                                                onChange={(e) => setAuthEmail(e.target.value)} 
                                                className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950" 
                                                required 
                                            />
                                        </div>
                                        <div>
                                            <label className="block mb-1 text-slate-700 dark:text-sky-200">New Password (Min 6 chars):</label>
                                            <input 
                                                type="password" 
                                                value={authPassword} 
                                                onChange={(e) => setAuthPassword(e.target.value)} 
                                                placeholder="Enter new password"
                                                minLength="6"
                                                className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950" 
                                                required 
                                            />
                                        </div>
                                        <button 
                                            type="submit" 
                                            disabled={authLoading}
                                            className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl shadow transition-all disabled:opacity-50"
                                        >
                                            {authLoading ? 'Saving Password...' : 'Save Password & Authenticate'}
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<MainApp />);
        } catch(e) {
            console.error("Render error:", e);
        }
    </script>
</body>
</html>
