                                                    Publish Special Greeting
                                                </button>
                                            </div>
                                        </form>

                                        <div className="space-y-2 pt-2">
                                            {greetings.map(g => (
                                                <div key={g.id} className="p-3 bg-white dark:bg-slate-900 rounded-xl border flex items-center justify-between text-xs font-semibold">
                                                    <div className="min-w-0 pr-2">
                                                        <div className="font-bold truncate">{g.text}</div>
                                                        <div className="text-[10px] text-slate-400">Status: {g.active ? 'Active' : 'Disabled'}</div>
                                                    </div>
                                                    <div className="flex space-x-2 shrink-0">
                                                        <button onClick={() => handleToggleGreetingStatus(g.id)} className="px-2.5 py-1 bg-sky-800 text-white rounded text-[10px]">
                                                            {g.active ? 'Disable' : 'Enable'}
                                                        </button>
                                                        <button onClick={() => handleDeleteGreeting(g.id)} className="px-2.5 py-1 bg-red-600 text-white rounded text-[10px]">
                                                            Delete
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* SOCIAL UPDATES MANAGER */}
                                    <div className="p-4 sm:p-5 rounded-2xl border border-sky-200 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 space-y-4">
                                        <h4 className="font-extrabold text-sm text-sky-900 dark:text-amber-300 flex items-center space-x-2">
                                            <i className="fa-solid fa-share-nodes text-blue-500"></i>
                                            <span>Social Media Announcements & Badges Manager</span>
                                        </h4>
                                        <form onSubmit={handleAddNewSocialUpdate} className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs font-bold">
                                            <div>
                                                <label className="block mb-1">Platform:</label>
                                                <select 
                                                    value={newSocialUpdateForm.platform}
                                                    onChange={(e) => setNewSocialUpdateForm({ ...newSocialUpdateForm, platform: e.target.value })}
                                                    className="w-full p-2.5 rounded-xl border border-sky-300 dark:border-sky-800 bg-white dark:bg-slate-900"
                                                >
                                                    <option value="whatsapp">WhatsApp Channel</option>
                                                    <option value="facebook">Facebook Page</option>
                                                    <option value="x">X (Twitter)</option>
                                                    <option value="instagram">Instagram</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block mb-1">Post Title / Announcement:</label>
                                                <input 
                                                    type="text" 
                                                    value={newSocialUpdateForm.title}
                                                    onChange={(e) => setNewSocialUpdateForm({ ...newSocialUpdateForm, title: e.target.value })}
                                                    placeholder="Post title..."
                                                    className="w-full p-2.5 rounded-xl border border-sky-300 dark:border-sky-800 bg-white dark:bg-slate-900"
                                                    required
                                                />
                                            </div>
                                            <div className="sm:col-span-2">
                                                <label className="block mb-1">Post Official URL:</label>
                                                <input 
                                                    type="url" 
                                                    value={newSocialUpdateForm.url}
                                                    onChange={(e) => setNewSocialUpdateForm({ ...newSocialUpdateForm, url: e.target.value })}
                                                    placeholder="https://..."
                                                    className="w-full p-2.5 rounded-xl border border-sky-300 dark:border-sky-800 bg-white dark:bg-slate-900"
                                                    required
                                                />
                                            </div>
                                            <div className="sm:col-span-2">
                                                <button type="submit" className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl shadow">
                                                    Publish Social Update & Badge Indicator
                                                </button>
                                            </div>
                                        </form>
                                    </div>

                                </div>
                            </div>
                        )}

                    </main>

                    {/* ADMIN LOGIN MODAL */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-slide-down">
                            <div className="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 shadow-2xl border-2 border-sky-200 dark:border-sky-800 relative">
                                <button onClick={() => setShowAdminLogin(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-white">
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 bg-amber-500 text-slate-950 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl shadow">
                                        <i className="fa-solid fa-user-shield"></i>
                                    </div>
                                    <h3 className="font-cinzel font-black text-lg text-sky-950 dark:text-amber-400">{t('adminLoginTitle')}</h3>
                                </div>
                                <form onSubmit={handleAdminLogin} className="space-y-4 text-xs font-bold">
                                    {loginError && <div className="p-3 bg-red-100 text-red-700 rounded-xl text-center">{loginError}</div>}
                                    <div>
                                        <label className="block mb-1 text-slate-700 dark:text-sky-200">{t('enterPass')}</label>
                                        <input 
                                            type="password" 
                                            value={adminPassword}
                                            onChange={(e) => setAdminPassword(e.target.value)}
                                            className="w-full p-3 rounded-xl border border-sky-300 dark:border-sky-800 bg-sky-50/50 dark:bg-slate-950 focus:ring-2 focus:ring-amber-400"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-sky-800 hover:bg-sky-900 text-white font-black rounded-xl shadow transition-all">
                                        {t('loginBtn')}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* APK DOWNLOAD POPUP */}
                    {isApkPopupOpen && (
                        <div 
                            className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-start justify-center pt-12 sm:pt-20 px-4 animate-slide-down"
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="apk-popup-title"
                        >
                            <div className="w-full max-w-[320px] bg-slate-900/95 border-2 border-amber-400/80 rounded-3xl p-5 shadow-2xl text-center text-white relative flex flex-col items-center">
                                
                                <button 
                                    onClick={closeApkPopup}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white text-lg w-7 h-7 flex items-center justify-center rounded-full hover:bg-slate-800 transition-colors"
                                    aria-label="Close popup"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <div className="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden bg-white border border-sky-300 dark:border-sky-700 p-0.5 shadow-sm mb-3 shrink-0 flex items-center justify-center">
                                    <img 
                                        src={siteSettings.apk_logo_url || FALLBACK_APK_LOGO_URL} 
                                        alt="Delhi GPO Library App logo" 
                                        className="w-full h-full object-cover rounded-full"
                                        onError={(e) => { e.target.onerror = null; e.target.src = FALLBACK_APK_LOGO_URL; }}
                                    />
                                </div>

                                <h3 id="apk-popup-title" className="font-cinzel font-black text-base sm:text-lg text-amber-300 mb-1">
                                    {t('apkPopupTitle')}
                                </h3>
                                
                                <p className="text-xs text-sky-200 font-semibold mb-4 leading-relaxed">
                                    {t('apkPopupSub')}
                                </p>

                                <button 
                                    onClick={handleApkDownloadClick}
                                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2 border border-emerald-400 mb-2 active:scale-95"
                                >
                                    <i className="fa-solid fa-download"></i>
                                    <span>{t('apkDownloadBtn')}</span>
                                </button>

                                <button 
                                    onClick={closeApkPopup}
                                    className="text-slate-400 hover:text-slate-200 text-xs font-bold underline transition-colors pt-1"
                                >
                                    {t('apkNotNowBtn')}
                                </button>
                            </div>
                        </div>
                    )}

                    {}
                    {/* FOOTER */}
                    <footer className="mt-auto bg-sky-950 text-sky-300 py-6 text-center text-xs font-bold border-t-4 border-amber-400 w-full max-w-full">
                        <div className="max-w-7xl mx-auto px-4 space-y-2">
                            <p className="leading-relaxed">© 2026 Delhi GPO – 110006. Department of Posts • Government of India.</p>
                            <p className="text-[10px] sm:text-xs text-sky-400 font-semibold leading-relaxed">Serving postal employees & members with honor, knowledge, and pride.</p>
                        </div>
                    </footer>

                </div>
            );
        }

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<MainApp />);
        } catch (err) {
            console.error("Mounting error:", err);
            document.getElementById('root').innerHTML = '<div style="padding:20px; color:red; font-weight:bold;">Application Error: ' + err.message + '</div>';
        }
    </script>
</body>
</html>
