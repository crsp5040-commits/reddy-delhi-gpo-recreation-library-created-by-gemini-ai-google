            const [showLangDropdown, setShowLangDropdown] = useState(false);
            const [darkMode, setDarkMode] = useState(() => safeStorage.getItem('gpo_library_theme') === 'dark');

            const [isLoading, setIsLoading] = useState(true);
            const [settingsLoading, setSettingsLoading] = useState(true);

            // CENTRAL SETTINGS STATE (SINGLE SOURCE OF TRUTH FROM DATABASE)
            const [siteSettings, setSiteSettings] = useState({});
            const [siteContent, setSiteContent] = useState(DEFAULT_SITE_CONTENT);
            const [toast, setToast] = useState(null);

            const showToast = useCallback((message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            }, []);

            const [books, setBooks] = useState(INITIAL_BOOKS);
            const [requisitions, setRequisitions] = useState([]);

                {
                    id: 1,
                    title: "Annual Stock Verification & Circulation Notice",
                    content: "All members holding books for more than 30 days are kindly requested to renew or return them promptly.",
                    date: new Date().toLocaleDateString(),
                    priority: "HIGH"
                }
            ]);

            const [activeView, setActiveView] = useState('HOME');
            const [viewMode, setViewMode] = useState('GRID');
            const [searchTerm, setSearchTerm] = useState('');
            const [categoryFilter, setCategoryFilter] = useState('ALL');
            const [mediumFilter, setMediumFilter] = useState('ALL');
            const [sortOption, setSortOption] = useState('SERIAL_ASC');
            const [currentPage, setCurrentPage] = useState(1);

            useEffect(() => { setCurrentPage(1); }, [searchTerm, categoryFilter, mediumFilter, activeView]);

            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [adminPassword, setAdminPassword] = useState('');
            const [loginError, setLoginError] = useState('');

            const [reqForm, setReqForm] = useState({
                bookId: '', empName: '', empId: '', cadre: '', branch: '', mobile: '', email: ''
            });

            // SINGLE APK POPUP SYSTEM STATE
            const [isApkPopupOpen, setIsApkPopupOpen] = useState(false);
            const [apkLogoError, setApkLogoError] = useState(false);

            const closeApkPopup = useCallback(() => {
                setIsApkPopupOpen(false);
            }, []);

            const loadSiteSettings = useCallback(async () => {
                setSettingsLoading(true);
                if (!supabaseClient) {
                    setSettingsLoading(false);
                    return;
                }
                try {
                    const { data, error } = await supabaseClient
                        .from('site_settings')
                        .select('setting_key, setting_value');

                    if (!error && data && data.length > 0) {
                        const loadedObj = {};
                        data.forEach(item => {
                            if (item.setting_key && item.setting_value) {
                                loadedObj[item.setting_key] = item.setting_value;
                            }
                        });
                        setSiteSettings(loadedObj);
                    }
                } catch (err) {
                    console.warn("Failed to load site settings from Supabase:", err);
                } finally {
                    setSettingsLoading(false);
                }
            }, []);

            const fetchAllData = useCallback(async () => {
                setIsLoading(true);
                try {
                    await loadSiteSettings();

                if (file.size > 5 * 1024 * 1024) {

                const filePath = `uploads/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;

                                                    <div className="w-6 h-6 sm:w-7 sm:h-7 rounded-lg bg-amber-100 dark:bg-amber-900/40 border border-amber-300 dark:border-amber-700 flex items-center justify-center shrink-0">
                                                        <i className="fa-solid fa-envelope text-amber-600 dark:text-amber-400 text-[10px] sm:text-xs"></i>
                                                    </div>
                                                    <a href={`mailto:${siteContent.libEmail}`} className="text-sky-900 dark:text-amber-300 font-extrabold text-[11px] sm:text-xs truncate hover:underline bg-amber-50 dark:bg-amber-950/50 px-2 py-0.5 rounded border border-amber-300 dark:border-amber-800">
                                                        {siteContent.libEmail}
                                                    </a>
                                                </div>
                                            </div>
                                        </div>

                                        {/* TIMINGS CARD */}
                                        <div className={`border-2 rounded-2xl p-4 sm:p-5 shadow-sm transition-all hover:shadow-md relative overflow-hidden flex flex-col justify-between ${darkMode ? 'bg-slate-900/90 border-sky-800 text-sky-100' : 'bg-gradient-to-br from-sky-50 via-blue-50 to-sky-100 border-sky-300 text-slate-900'}`}>
                                            <div>
                                                <div className="flex items-center justify-between mb-3 border-b border-sky-200 dark:border-sky-800 pb-2">
                                                    <span className="text-[10px] sm:text-xs font-black uppercase tracking-wider text-red-600 dark:text-red-400 flex items-center space-x-1.5 bg-red-100 dark:bg-red-950/60 border border-red-300 dark:border-red-800 px-2.5 py-1 rounded-lg shadow-sm">
                                                        <i className="fa-solid fa-clock text-amber-600 dark:text-amber-400"></i>
                                                        <span>{t('timingsTitle')}</span>
                                                    </span>
                                                    <i className="fa-solid fa-calendar-days text-amber-600 dark:text-amber-400"></i>
                                                </div>
                                                <div className="text-slate-900 font-black text-xs mb-3 bg-gradient-to-r from-amber-300 via-amber-400 to-yellow-400 px-3 py-1.5 rounded-xl w-fit shadow-sm border border-amber-300 flex items-center space-x-1.5">
                                                    <i className="fa-solid fa-calendar-check text-red-700"></i>
                                                    <span>{siteContent.timingsDays}</span>
                                                </div>
                                            </div>
                                            <div className="space-y-2 font-bold text-xs pt-3 border-t border-sky-200 dark:border-sky-800">
                                                <div className="flex flex-col xs:flex-row justify-between items-start xs:items-center gap-1 bg-white/80 dark:bg-slate-950/60 p-2.5 rounded-xl border border-sky-200 dark:border-sky-900">
                                                    <span className="text-sky-900 dark:text-sky-200 flex items-center space-x-1.5 text-[11px] sm:text-xs">
                                                        <i className="fa-solid fa-sun text-amber-500"></i>
                                                        <span>{t('morning')}</span>
                                                    </span>
                                                    <span className="text-amber-700 dark:text-amber-300 font-black text-[10px] sm:text-xs bg-amber-100 dark:bg-amber-950/80 border border-amber-300 dark:border-amber-700 px-2 py-0.5 rounded-lg">{siteContent.morningTiming}</span>
                                                </div>
                                                <div className="flex flex-col xs:flex-row justify-between items-start xs:items-center gap-1 bg-white/80 dark:bg-slate-950/60 p-2.5 rounded-xl border border-sky-200 dark:border-sky-900">
                                                    <span className="text-sky-900 dark:text-sky-200 flex items-center space-x-1.5 text-[11px] sm:text-xs">
                                                        <i className="fa-solid fa-moon text-amber-500"></i>
                                                        <span>{t('evening')}</span>
                                                    </span>
                                                    <span className="text-amber-700 dark:text-amber-300 font-black text-[10px] sm:text-xs bg-amber-100 dark:bg-amber-950/80 border border-amber-300 dark:border-amber-700 px-2 py-0.5 rounded-lg">{siteContent.eveningTiming}</span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* RULES & GUIDELINES CARD */}
                                        <div className={`border-2 rounded-2xl p-4 sm:p-5 shadow-sm transition-all hover:shadow-md relative overflow-hidden flex flex-col justify-between md:col-span-2 lg:col-span-1 ${darkMode ? 'bg-slate-900/90 border-sky-800 text-sky-100' : 'bg-gradient-to-br from-sky-50 via-blue-50 to-sky-100 border-sky-300 text-slate-900'}`}>
                                            <div>
                                                <div className="flex items-center justify-between mb-3 border-b border-sky-200 dark:border-sky-800 pb-2">
                                                    <span className="text-[10px] sm:text-xs font-black uppercase tracking-wider text-red-600 dark:text-red-400 flex items-center space-x-1.5 bg-red-100 dark:bg-red-950/60 border border-red-300 dark:border-red-800 px-2.5 py-1 rounded-lg shadow-sm">
                                                        <i className="fa-solid fa-triangle-exclamation text-amber-600 dark:text-amber-400"></i>
                                                        <span>{t('rulesTitle')}</span>
                                                    </span>
                                                    <i className="fa-solid fa-shield-halved text-amber-600 dark:text-amber-400"></i>
                                                </div>
                                                <ul className="space-y-1.5 font-semibold text-[11px] sm:text-xs text-slate-800 dark:text-sky-100">
                                                    <li className="flex items-start bg-white/80 dark:bg-slate-950/60 p-2 rounded-xl border-l-4 border-amber-500 border-r border-y border-sky-200 dark:border-sky-900">
                                                        <i className="fa-solid fa-circle-check text-amber-600 dark:text-amber-400 mr-1.5 mt-0.5 shrink-0 text-xs"></i>
                                                        <span>{siteContent.rule1}</span>
                                                    </li>
                                                    <li className="flex items-start bg-white/80 dark:bg-slate-950/60 p-2 rounded-xl border-l-4 border-sky-500 border-r border-y border-sky-200 dark:border-sky-900">
                                                        <i className="fa-solid fa-circle-check text-amber-600 dark:text-amber-400 mr-1.5 mt-0.5 shrink-0 text-xs"></i>
                                                        <span>{siteContent.rule2}</span>
                                                    </li>
                                                    <li className="flex items-start bg-white/80 dark:bg-slate-950/60 p-2 rounded-xl border-l-4 border-emerald-500 border-r border-y border-sky-200 dark:border-sky-900">
                                                        <i className="fa-solid fa-circle-check text-amber-600 dark:text-amber-400 mr-1.5 mt-0.5 shrink-0 text-xs"></i>
                                                        <span>{siteContent.rule3}</span>
                                                    </li>
                                                </ul>
                                            </div>
                                            <div className="mt-2.5 flex items-start text-red-800 dark:text-red-300 font-bold bg-red-100/90 dark:bg-red-950/60 p-2.5 rounded-xl border-2 border-red-400/80 shadow-sm">
                                                <i className="fa-solid fa-triangle-exclamation text-red-600 dark:text-amber-400 text-xs sm:text-sm mr-2 mt-0.5 shrink-0 animate-pulse"></i>
                                                <span className="leading-snug text-[10px] sm:text-xs">{siteContent.rule4}</span>
                                            </div>
                                        </div>

                                    </div>
                                </div>

                            </div>
                        )}

                        {/* CATALOG VIEWS */}
                        {(activeView === 'TOTAL_BOOKS' || activeView === 'AVAIL_BOOKS' || activeView === 'ISSUED_BOOKS') && (
                            <div className="space-y-4 sm:space-y-6 animate-slide-down w-full max-w-full">
                                <div className={`p-4 sm:p-6 rounded-2xl border shadow-md space-y-4 w-full max-w-full ${darkMode ? 'bg-slate-900 border-sky-900' : 'bg-white border-sky-200'}`}>
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-4 border-sky-100 dark:border-sky-900">
                                        <div>
                                            <h3 className={`font-cinzel font-extrabold text-base sm:text-xl ${darkMode ? 'text-amber-400' : 'text-sky-900'}`}>
                                                {activeView === 'TOTAL_BOOKS' && t('cardTotal')}
                                                {activeView === 'AVAIL_BOOKS' && t('cardAvail')}
                                                {activeView === 'ISSUED_BOOKS' && t('cardIssued')}
                                            </h3>
                                            <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                                {t('showingVolumes')} {paginatedBooks.length} {t('ofVolumes')} {filteredBooks.length} {t('volumesText')} {t('perPageText')}
                                            </p>
                                        </div>

                                        <div className={`flex items-center space-x-1.5 p-1 rounded-xl border ${darkMode ? 'bg-slate-950 border-sky-900' : 'bg-sky-50 border-sky-200'}`}>
                                            <button onClick={() => setViewMode('GRID')} className={`px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'GRID' ? 'bg-sky-700 text-white shadow' : 'text-slate-600 dark:text-slate-300'}`}>
                                                <i className="fa-solid fa-border-all mr-1"></i> {t('viewGrid')}
                                            </button>
                                            <button onClick={() => setViewMode('TABLE')} className={`px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'TABLE' ? 'bg-sky-700 text-white shadow' : 'text-slate-600 dark:text-slate-300'}`}>
                                                <i className="fa-solid fa-list mr-1"></i> {t('viewTable')}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 sm:gap-3 text-xs sm:text-sm">
                                        <input type="text" placeholder={t('searchPlaceholder')} value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className={`p-2.5 border rounded-xl focus:outline-none focus:border-sky-600 text-xs sm:text-sm min-h-[42px] ${darkMode ? 'bg-slate-950 border-sky-900 text-white' : 'bg-white border-sky-200'}`} />
                                        <select value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)} className={`p-2.5 border rounded-xl focus:outline-none focus:border-sky-600 text-xs sm:text-sm min-h-[42px] ${darkMode ? 'bg-slate-950 border-sky-900 text-white' : 'bg-white border-sky-200'}`}>
                                            <option value="ALL">{t('allCategories')}</option>
                                            <option value="Self Help">Self Help</option>
                                            <option value="Fiction">Fiction</option>
                                            <option value="Literature">Literature</option>
                                            <option value="Biography">Biography</option>
                                            <option value="Philosophy">Philosophy</option>
                                            <option value="Health & Fitness">Health & Fitness</option>
                                        </select>
                                        <select value={mediumFilter} onChange={(e) => setMediumFilter(e.target.value)} className={`p-2.5 border rounded-xl focus:outline-none focus:border-sky-600 text-xs sm:text-sm min-h-[42px] ${darkMode ? 'bg-slate-950 border-sky-900 text-white' : 'bg-white border-sky-200'}`}>
                                            <option value="ALL">{t('allLanguages')}</option>
                                            <option value="Hindi">Hindi</option>
                                            <option value="English">English</option>
                                        </select>
                                        <select value={sortOption} onChange={(e) => setSortOption(e.target.value)} className={`p-2.5 border rounded-xl focus:outline-none focus:border-sky-600 text-xs sm:text-sm min-h-[42px] ${darkMode ? 'bg-slate-950 border-sky-900 text-white' : 'bg-white border-sky-200'}`}>
                                            <option value="SERIAL_ASC">{t('sortSerialAsc')}</option>
                                            <option value="SERIAL_DESC">{t('sortSerialDesc')}</option>
                                            <option value="A-Z">{t('sortAZ')}</option>
                                            <option value="Z-A">{t('sortZA')}</option>
                                        </select>
                                    </div>
                                </div>

                                {viewMode === 'GRID' && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 w-full max-w-full">
                                        {paginatedBooks.map(book => (
                                            <div key={book.id} className={`rounded-2xl border p-4 sm:p-5 shadow-sm hover:shadow-md transition-all flex flex-col justify-between ${darkMode ? 'bg-slate-900 border-sky-900' : 'bg-white border-sky-200'}`}>
                                                <div>
                                                    <div className="flex justify-between items-start mb-3">
                                                        <span className="px-2.5 py-1 bg-sky-100 text-sky-900 border border-sky-200 font-extrabold text-[11px] sm:text-xs rounded-xl shadow-sm">
                                                            {t('bookNoLabel')} {book.id}
                                                        </span>
                                                        <span className={`px-2.5 py-1 font-bold text-[10px] sm:text-xs rounded-full ${
                                                            book.status === 'Available' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                                                        }`}>
                                                            {book.status === 'Available' ? t('statusAvailable') : t('statusIssued')}
                                                        </span>
                                                    </div>
                                                    <h4 className={`font-bold text-sm sm:text-base line-clamp-2 ${darkMode ? 'text-white' : 'text-slate-900'}`}>{book.title}</h4>
                                                    <p className="text-xs sm:text-sm my-1.5 font-medium text-slate-500 dark:text-slate-400"><i className="fa-solid fa-pen-nib mr-1 text-sky-600"></i>{book.author}</p>
                                                    <div className="flex flex-wrap gap-1.5 text-[10px] sm:text-xs mt-3">
                                                        <span className={`px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg font-semibold ${darkMode ? 'bg-slate-950 text-sky-200' : 'bg-sky-50 text-sky-800 border border-sky-200'}`}>{book.category}</span>
                                                        <span className={`px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-lg font-semibold ${darkMode ? 'bg-slate-950 text-sky-200' : 'bg-sky-50 text-sky-800 border border-sky-200'}`}>{book.medium}</span>
                                                    </div>
                                                </div>

                                                <div className="mt-4 sm:mt-5 pt-3 border-t border-sky-100 dark:border-sky-900 flex justify-between items-center">
                                                    {book.status === 'Available' ? (
                                                        <button onClick={() => { setReqForm({ ...reqForm, bookId: book.id.toString() }); setActiveView('REQUISITION'); }} className="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white text-xs sm:text-sm font-bold rounded-xl shadow transition-all flex items-center justify-center space-x-1.5 min-h-[40px]">
                                                            <i className="fa-solid fa-paper-plane text-xs"></i>
                                                            <span>{t('reqBtn')}</span>
                                                        </button>
                                                    ) : (
                                                        <div className="w-full text-xs p-2 rounded-xl border border-sky-200 dark:border-sky-900 bg-sky-50/50 dark:bg-slate-950 text-slate-500 truncate">
                                                            <span className="font-bold text-sky-900 dark:text-sky-200">{t('issuedToLabel')}</span> {book.issuedTo || book.issued_to || 'Member'}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ADMIN PANEL VIEW */}
                        {activeView === 'ADMIN_PANEL' && isAdminLoggedIn && (
                            <div className="space-y-6 sm:space-y-8 animate-slide-down w-full max-w-full">
                                <div className={`p-4 sm:p-5 rounded-2xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 shadow-md w-full max-w-full ${darkMode ? 'bg-slate-900 border-sky-900' : 'bg-white border-sky-200'}`}>
                                    <div>
                                        <h3 className={`font-cinzel font-black text-base sm:text-xl ${darkMode ? 'text-amber-400' : 'text-sky-900'}`}>
                                            <i className="fa-solid fa-user-shield text-red-600 mr-2"></i>
                                            {t('adminPanelTitle')}
                                        </h3>
                                        <p className="text-xs sm:text-sm text-slate-400">{t('adminControlDesk')}</p>
                                    </div>
                                    <button onClick={() => { setIsAdminLoggedIn(false); setActiveView('HOME'); }} className="px-4 py-2 bg-sky-800 hover:bg-sky-900 text-white rounded-xl text-xs sm:text-sm font-bold shadow shrink-0">
                                        {t('logoutBtn')}
                                    </button>
                                </div>

                                {/* ADMIN APK & MEDIA MANAGER */}
                                <div className={`p-4 sm:p-6 rounded-2xl border shadow-md space-y-4 sm:space-y-5 w-full max-w-full ${darkMode ? 'bg-slate-900 border-sky-900' : 'bg-white border-sky-200'}`}>
                                    <h4 className="font-bold text-xs sm:text-base text-sky-700 dark:text-sky-300 uppercase tracking-wider flex items-center space-x-2 border-b border-sky-100 dark:border-sky-900 pb-3">
                                        <i className="fa-solid fa-mobile-screen-button text-amber-500"></i>
                                        <span>APK Download & Media Settings (`site_settings` UPSERT)</span>
                                    </h4>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs sm:text-sm font-semibold">
                                        
                                        {/* APK DOWNLOAD URL MANAGER */}
                                        <div className="p-3.5 bg-sky-50 dark:bg-slate-950 border rounded-xl space-y-2 md:col-span-2">
                                            <label className="block text-slate-700 dark:text-sky-200 font-bold">1. APK Download Link (`apk_url`)</label>
                                            <div className="flex gap-2 pt-1">
                                                <input 
                                                    type="url" 
                                                    placeholder="Paste Public APK URL"
                                                    value={siteSettings.apk_url || ''}
                                                    onChange={(e) => setSiteSettings({ ...siteSettings, apk_url: e.target.value })}
                                                    className="flex-1 p-2.5 border rounded-xl text-xs dark:bg-slate-900 dark:text-white"
                                                />
                                                <button 
                                                    onClick={() => updateSiteSettingInDb('apk_url', siteSettings.apk_url, "APK download link శాశ్వతంగా సేవ్ అయింది.")}
                                                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow"
                                                >Save Link</button>
                                            </div>
                                        </div>

                                        {/* APK LOGO IMAGE MANAGER */}
                                        <div className="p-3.5 bg-sky-50 dark:bg-slate-950 border rounded-xl space-y-2">
                                            <label className="block text-slate-700 dark:text-sky-200 font-bold">2. APK Popup Logo Image (`apk_logo_url`)</label>
                                            <input 
                                                type="file" accept="image/*"
                                                onChange={(e) => handleImageFileUpload(e.target.files[0], 'apk_logo_url', "APK లోగో శాశ్వతంగా సేవ్ అయింది.")}
                                                className="w-full text-xs p-1"
                                            />
                                            <div className="flex gap-2 pt-1">
                                                <input 
                                                    type="url" placeholder="Paste Public Image URL"
                                                    value={siteSettings.apk_logo_url || ''}
                                                    onChange={(e) => setSiteSettings({ ...siteSettings, apk_logo_url: e.target.value })}
                                                    className="flex-1 p-2 border rounded-lg text-xs dark:bg-slate-900 dark:text-white"
                                                />
                                                <button 
                                                    onClick={() => updateSiteSettingInDb('apk_logo_url', siteSettings.apk_logo_url, "APK లోగో శాశ్వతంగా సేవ్ అయింది.")}
                                                    className="px-3 py-1 bg-sky-800 text-white rounded-lg text-xs font-bold"
                                                >Save</button>
                                            </div>
                                        </div>

                                        {/* SITE LOGO MANAGER */}
                                        <div className="p-3.5 bg-sky-50 dark:bg-slate-950 border rounded-xl space-y-2">
                                            <label className="block text-slate-700 dark:text-sky-200 font-bold">3. Website Header Logo (`site_logo_url`)</label>
                                            <input 
                                                type="file" accept="image/*"
                                                onChange={(e) => handleImageFileUpload(e.target.files[0], 'site_logo_url', "చిత్రం శాశ్వతంగా సేవ్ అయింది.")}
                                                className="w-full text-xs p-1"
                                            />
                                            <div className="flex gap-2 pt-1">
                                                <input 
                                                    type="url" placeholder="Paste Public Image URL"
                                                    value={siteSettings.site_logo_url || ''}
                                                    onChange={(e) => setSiteSettings({ ...siteSettings, site_logo_url: e.target.value })}
                                                    className="flex-1 p-2 border rounded-lg text-xs dark:bg-slate-900 dark:text-white"
                                                />
                                                <button 
                                                    onClick={() => updateSiteSettingInDb('site_logo_url', siteSettings.site_logo_url, "చిత్రం శాశ్వతంగా సేవ్ అయింది.")}
                                                    className="px-3 py-1 bg-sky-800 text-white rounded-lg text-xs font-bold"
                                                >Save</button>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* SINGLE COMPACT APK POPUP MODAL */}
                    {isApkPopupOpen && (
                        <div 
                            role="dialog" 
                            aria-modal="true" 
                            aria-labelledby="apk-popup-title" 
                            className="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-start justify-center pt-12 sm:pt-20 p-3.5 animate-slide-down"
                        >
                            <div className="bg-sky-950/95 border-2 border-amber-400/90 rounded-2xl max-w-[320px] sm:max-w-xs w-full p-4 sm:p-5 text-white shadow-2xl flex flex-col items-center text-center backdrop-blur-md">
                                
                                {/* PROMINENT APP LOGO */}
                                <div 
                                    className="mb-3 mt-1 shrink-0 cursor-pointer group"
                                    onClick={() => {
                                        closeApkPopup();
                                        setActiveView('HOME');
                                    }}
                                    title="Click to view Home"
                                    role="button"
                                    tabIndex={0}
                                >
                                    {!apkLogoError ? (
                                        <img 
                                            src={siteSettings.apk_logo_url || FALLBACK_APK_LOGO_URL} 
                                            alt="Delhi GPO Library App logo" 
                                            className="w-16 h-16 sm:w-20 sm:h-20 rounded-full object-cover border-2 border-amber-400 shadow-lg group-hover:scale-105 transition-transform p-0.5 bg-sky-900"
                                            onError={() => setApkLogoError(true)}
                                        />
                                    ) : (
                                        <div className="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-amber-400 text-sky-950 flex items-center justify-center text-2xl font-black border-2 border-amber-300 shadow-lg">
                                            <i className="fa-solid fa-download"></i>
                                        </div>
                                    )}
                                </div>

                                {/* TITLE & SUBTITLE */}
                                <h3 id="apk-popup-title" className="font-cinzel font-bold text-sm sm:text-base text-amber-300 leading-snug">
                                    {t('apkPopupTitle')}
                                </h3>
                                <p className="text-xs text-sky-100 mt-1.5 mb-3.5 font-medium leading-relaxed">
                                    {t('apkPopupSub')}
                                </p>

                                {/* ACTION BUTTONS */}
                                <div className="flex items-center justify-center space-x-2.5 w-full">
                                    <button 
                                        onClick={handleApkDownloadClick}
                                        className="flex-1 py-2 px-3 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black rounded-xl text-xs shadow-lg hover:shadow-emerald-500/50 transition-all active:scale-95 border border-amber-300 flex items-center justify-center space-x-1.5 cursor-pointer"
                                    >
                                        <i className="fa-solid fa-download text-xs"></i>
                                        <span>{t('apkDownloadBtn')}</span>
                                    </button>
                                    <button 
                                        onClick={closeApkPopup}
                                        className="px-3 py-2 bg-sky-900/80 hover:bg-sky-800 text-sky-200 hover:text-white font-bold rounded-xl text-xs border border-sky-700 transition-all cursor-pointer shrink-0"
                                    >
                                        {t('apkNotNowBtn')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
