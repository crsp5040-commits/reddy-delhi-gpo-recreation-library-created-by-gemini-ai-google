                        sData.forEach(row => {
                            if (row.key === 'hero_image' && row.value) setHeroImage(row.value);
                            if (row.key === 'desk_image' && row.value) setDeskImage(row.value);
                            if (row.key === 'apk_url' && row.value) setApkUrl(row.value);
                            if (row.key === 'site_content' && row.value) {
                                try { setSiteContent(JSON.parse(row.value)); } catch(e){}
                            }
                        });
                    }
                } catch (err) {
                    console.error("Supabase load error:", err);
                    setDataError("డేటా లోడ్ చేయడంలో లోపం ఏర్పడింది. దయచేసి ఇంటర్నెట్ సరిగ్గా ఉందో లేదో చూడండి.");
                } finally {
                    setIsLoading(false);
                }
            }, []);

            useEffect(() => {
                fetchAllData();
            }, [fetchAllData]);

            // LOCAL STORAGE FALLBACK SYNCHRONIZATION
            useEffect(() => { safeStorage.setItem('gpo_library_books', JSON.stringify(books)); }, [books]);
            useEffect(() => { safeStorage.setItem('gpo_library_reqs', JSON.stringify(requisitions)); }, [requisitions]);
            useEffect(() => { safeStorage.setItem('gpo_library_notices', JSON.stringify(notices)); }, [notices]);
            useEffect(() => { safeStorage.setItem('gpo_library_notifications', JSON.stringify(notifications)); }, [notifications]);

            useEffect(() => { safeStorage.setItem('gpo_library_apk_url', apkUrl); }, [apkUrl]);

            useEffect(() => {

                else document.documentElement.classList.remove('dark');
            }, [darkMode]);

            // SESSION-BASED INSTALL APP FLOATING BUTTON CHECK
            useEffect(() => {

                    setDeferredPrompt(e);

            const t = (key) => TRANSLATIONS[lang]?.[key] || TRANSLATIONS['EN'][key] || key;

            const handlePostNotice = async (e) => {

                    priority: newNoticeForm.priority,

                    setNotices(prev => [{ id: Date.now(), ...noticeObj }, ...prev]);

                    id: Date.now() + 1,

                    type: 'NOTICE',

                    unread: true
                };
                setNotifications(prev => [newNotif, ...prev]);
                setNewNoticeForm({ title: '', content: '', priority: 'NORMAL' });
                showToast('Notice published and saved to database!', 'success');
            };

            const handleDeleteNotice = async (noticeId) => {
                if (supabaseClient) {
                    await supabaseClient.from('notices').delete().eq('id', noticeId);
                }
                setNotices(prev => prev.filter(n => n.id !== noticeId));
                showToast('Notice deleted successfully.', 'info');
            };

            const pendingRequestsCount = useMemo(() => {

            }, [requisitions]);

            const filteredBooks = useMemo(() => {
                return books.filter(book => {
                    if (activeView === 'AVAIL_BOOKS' && book.status !== 'Available') return false;
                    if (activeView === 'ISSUED_BOOKS' && book.status !== 'Issued') return false;

                    const matchesSearch = (book.title || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          (book.author || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                                          (book.id || '').toString().includes(searchTerm);
                    
                    const matchesCategory = categoryFilter === 'ALL' || book.category === categoryFilter;
                    const matchesMedium = mediumFilter === 'ALL' || book.medium === mediumFilter;

                    return matchesSearch && matchesCategory && matchesMedium;
                }).sort((a, b) => {
                    if (sortOption === 'SERIAL_ASC') return (a.id || 0) - (b.id || 0);
                    if (sortOption === 'SERIAL_DESC') return (b.id || 0) - (a.id || 0);
                    if (sortOption === 'A-Z') return (a.title || '').localeCompare(b.title || '');
                    if (sortOption === 'Z-A') return (b.title || '').localeCompare(a.title || '');
                    return 0;
                });
            }, [books, activeView, searchTerm, categoryFilter, mediumFilter, sortOption]);

            const pageSize = 15;
            const totalPages = Math.ceil(filteredBooks.length / pageSize) || 1;
            const paginatedBooks = useMemo(() => {
                const start = (currentPage - 1) * pageSize;

            const handleAdminLogin = (e) => {

                }
            };

            const handleRequisitionSubmit = async (e) => {
                e.preventDefault();
                const bookToReq = books.find(b => b.id === parseInt(reqForm.bookId));
                if (!bookToReq) return;

                const newReq = {
                    book_id: bookToReq.id,
                    book_title: bookToReq.title,
                    emp_name: reqForm.empName,
                    emp_id: reqForm.empId,
                    cadre: reqForm.cadre,
                    branch: reqForm.branch,
                    mobile: reqForm.mobile,
                    email: reqForm.email,
                    req_date: new Date().toLocaleDateString(),
                    status: 'Pending',
                    created_at: new Date().toISOString()
                };

                if (supabaseClient) {
                    const { data, error } = await supabaseClient.from('requisitions').insert([newReq]).select();
                    if (!error && data) setRequisitions(prev => [data[0], ...prev]);
                    else setRequisitions(prev => [{ id: Date.now(), bookId: bookToReq.id, bookTitle: bookToReq.title, ...reqForm, reqDate: new Date().toLocaleDateString(), status: 'Pending' }, ...prev]);
                } else {
                    setRequisitions(prev => [{ id: Date.now(), bookId: bookToReq.id, bookTitle: bookToReq.title, ...reqForm, reqDate: new Date().toLocaleDateString(), status: 'Pending' }, ...prev]);

                const reqNotif = {
                    id: Date.now() + 1,

                    content: `Your request for "${bookToReq.title}" by ${reqForm.empName} (${reqForm.empId}) has been submitted to database.`,

                setNotifications(prev => [reqNotif, ...prev]);

            const handleApproveReq = async (req) => {
                const issueDateObj = new Date();
                const dueDateObj = new Date();
                dueDateObj.setDate(dueDateObj.getDate() + 15);

                const issueDateStr = issueDateObj.toLocaleDateString();
                const dueDateStr = dueDateObj.toLocaleDateString();

                if (supabaseClient) {
                    await supabaseClient.from('requisitions').update({ status: 'Approved', issue_date: issueDateStr, due_date: dueDateStr }).eq('id', req.id);
                    await supabaseClient.from('books').update({
                        status: 'Issued',
                        issued_to: req.emp_name || req.empName,
                        issued_mobile: req.mobile,
                        issued_email: req.email,
                        issue_date: issueDateStr,
                        due_date: dueDateStr
                    }).eq('id', req.book_id || req.bookId);

                    await supabaseClient.from('issues').insert([{
                        book_id: req.book_id || req.bookId,
                        member_name: req.emp_name || req.empName,
                        emp_id: req.emp_id || req.empId,

                        due_date: dueDateStr,

                }

                setNewBookForm({ title: '', author: '', category: 'Self Help', medium: 'English' });

            const handleImageUpload = async (file, settingsKey) => {
                if (!file) return;
                const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
                if (!allowedTypes.includes(file.type)) {
                    showToast("Please upload a valid JPG, PNG or WEBP image.", "error");
                    return;
                }
                if (file.size > 5 * 1024 * 1024) {
                    showToast("File size must be under 5 MB.", "error");
                    return;
                }

                const filePath = `uploads/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
                
                if (supabaseClient) {
                    try {
                        const { data: uData, error: uErr } = await supabaseClient.storage.from('library-images').upload(filePath, file);
                        if (uErr) throw uErr;

                        const { data: pData } = supabaseClient.storage.from('library-images').getPublicUrl(filePath);
                        const publicUrl = pData.publicUrl;

                        await supabaseClient.from('settings').upsert({ key: settingsKey, value: publicUrl }, { onConflict: 'key' });

                        if (settingsKey === 'hero_image') setHeroImage(publicUrl);
                        if (settingsKey === 'desk_image') setDeskImage(publicUrl);

                        showToast("Image uploaded to library-images bucket and saved!", "success");
                    } catch (err) {
                        console.error("Image upload error:", err);
                        showToast("Upload failed. Using temporary fallback preview.", "error");
                    }

                                </div>

                                {notifications.length === 0 ? (
                                    <p className="text-xs text-slate-400 italic py-6 text-center">{t('noNotifMsg')}</p>
                                ) : (
                                    <div className="space-y-2.5 overflow-y-auto custom-scrollbar text-xs pr-1">
                                        {notifications
                                            .filter(n => notifFilter === 'ALL' || n.type === notifFilter)
                                            .map(notif => (
                                                <div 
                                                    key={notif.id} 
                                                    className={`p-2.5 sm:p-3 rounded-xl border transition-all ${notif.unread ? 'bg-sky-900/60 border-amber-400/60 shadow' : 'bg-sky-950/40 border-sky-900 opacity-80'}`}
                                                >
                                                    <div className="flex justify-between items-start mb-1">
                                                        <span className="font-extrabold text-amber-300 text-xs flex items-center space-x-1.5">
                                                            <i className={`fa-solid ${notif.type === 'BOOK' ? 'fa-book text-emerald-400' : 'fa-bullhorn text-amber-400'}`}></i>
                                                            <span>{notif.title}</span>
                                                        </span>
                                                        {notif.unread && (
                                                            <span className="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
                                                        )}
                                                    </div>
                                                    <p className="text-sky-100 leading-relaxed font-medium text-[11px] my-1">{notif.content}</p>
                                                    <div className="text-[10px] text-sky-300 font-semibold text-right">
                                                        {notif.date}
                                                    </div>
                                                </div>
                                            ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: NOTICE BOARD DETAILS VIEW */}
                    {showNoticeModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col p-4 sm:p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowNoticeModal(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="flex items-center space-x-3 border-b border-sky-900 pb-3 mb-3 shrink-0">
                                    <div className="w-9 h-9 sm:w-10 sm:h-10 bg-red-600 rounded-full flex items-center justify-center border border-amber-400 shrink-0">
                                        <i className="fa-solid fa-bullhorn text-amber-400 text-base sm:text-lg"></i>
                                    </div>
                                    <div>
                                        <h3 className="font-cinzel font-bold text-xs sm:text-base text-amber-300">{t('noticeBoardTitle')}</h3>
                                        <p className="text-[11px] sm:text-xs text-sky-200">{siteContent.libClub}</p>
                                    </div>
                                </div>

                                {notices.length === 0 ? (
                                    <p className="text-xs text-slate-400 italic py-4 text-center">{t('noNoticesMsg')}</p>
                                ) : (
                                    <div className="space-y-3 overflow-y-auto custom-scrollbar text-xs pr-1">
                                        {notices.map(notice => (
                                            <div key={notice.id} className="p-3 bg-sky-900/50 border border-sky-800 rounded-xl space-y-1">
                                                <div className="flex justify-between items-start gap-2">
                                                    <span className="font-extrabold text-amber-400 text-xs sm:text-sm">{notice.title}</span>
                                                    {notice.priority === 'HIGH' && (
                                                        <span className="px-2 py-0.5 bg-red-600 text-white font-extrabold text-[8px] sm:text-[9px] rounded-full uppercase shrink-0">
                                                            {t('importantNotice')}
                                                        </span>
                                                    )}
                                                </div>
                                                <p className="text-sky-100 leading-relaxed font-medium text-[11px] sm:text-xs">{notice.content}</p>
                                                <div className="text-[10px] text-sky-300 font-semibold pt-1 text-right">
                                                    Date: {notice.date}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: ADMIN LOGIN */}
                    {showAdminLogin && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-sm w-full p-5 sm:p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowAdminLogin(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="text-center mb-4">
                                    <div className="w-11 h-11 sm:w-12 sm:h-12 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-2 shadow border border-amber-400">
                                        <i className="fa-solid fa-user-shield text-amber-400 text-lg sm:text-xl"></i>
                                    </div>
                                    <h3 className="font-cinzel font-bold text-sm sm:text-base text-amber-300">{t('adminLoginTitle')}</h3>
                                </div>

                                <form onSubmit={handleAdminLogin} className="space-y-3.5 text-xs font-semibold">
                                    <div>
                                        <label className="block mb-1 text-sky-200">{t('enterPass')}</label>
                                        <div className="relative">
                                            <input 
                                                type={showAdminPassword ? "text" : "password"} 
                                                required
                                                placeholder="••••••••"
                                                value={adminPassword}
                                                onChange={(e) => setAdminPassword(e.target.value)}
                                                className="w-full p-2.5 pr-10 bg-slate-900 border border-sky-800 rounded-xl text-white focus:outline-none focus:border-amber-400 min-h-[42px]"
                                            />
                                            <button 
                                                type="button"
                                                onClick={() => setShowAdminPassword(!showAdminPassword)}
                                                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 text-sm"
                                                title={showAdminPassword ? t('hidePass') : t('showPass')}
                                            >
                                                <i className={`fa-solid ${showAdminPassword ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                    </div>

                                    {loginError && <p className="text-red-400 font-bold">{loginError}</p>}

                                    <button 
                                        type="submit"
                                        className="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow min-h-[42px]"
                                    >
                                        {t('loginBtn')}
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: REJECT REQUISITION */}
                    {showRejectModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-sm w-full p-5 sm:p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowRejectModal(null)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <h3 className="font-cinzel font-bold text-xs sm:text-base text-amber-300 mb-2">{t('rejectModalTitle')}</h3>
                                <p className="text-xs text-sky-200 mb-2">{t('bookNoLabel')} {showRejectModal.book_id || showRejectModal.bookId} - {showRejectModal.book_title || showRejectModal.bookTitle}</p>
                                
                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-300 mb-1">{t('rejectReasonLabel')}</label>
                                        <textarea 
                                            rows="3"
                                            value={rejectReason}
                                            onChange={(e) => setRejectReason(e.target.value)}
                                            placeholder="e.g. Book under maintenance or reference only"
                                            className="w-full p-2.5 bg-slate-900 border border-sky-800 rounded-xl text-white focus:outline-none focus:border-amber-400"
                                        ></textarea>
                                    </div>
                                    <button 
                                        onClick={handleConfirmReject}
                                        className="w-full py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow"
                                    >
                                        {t('confirmRejectBtn')}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: APP INSTALLATION GUIDE */}
                    {showInstallModal && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
                            <div className="bg-sky-950 border-2 border-amber-400 rounded-2xl max-w-md w-full p-5 sm:p-6 text-white shadow-2xl relative animate-fade-in-up">
                                <button 
                                    onClick={() => setShowInstallModal(false)}
                                    className="absolute top-3 right-3 text-slate-400 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>

                                <div className="text-center mb-3">
                                    <div className="w-11 h-11 bg-red-600 rounded-full flex items-center justify-center mx-auto mb-2 border border-amber-400 shadow-lg">
                                        <i className="fa-solid fa-mobile-screen-button text-amber-200 text-lg"></i>
                                    </div>
                                    <h3 className="font-cinzel font-bold text-xs sm:text-base text-amber-300">{t('installModalTitle')}</h3>
                                    <p className="text-[11px] sm:text-xs text-sky-200 mt-0.5">{t('installModalSub')}</p>
                                </div>

                                <div className="space-y-3 text-xs bg-slate-900 p-3.5 rounded-xl border border-sky-900">
                                    <div className="font-bold text-amber-400 border-b border-sky-800 pb-1.5">
                                        Direct APK Download:
                                    </div>
                                    <a 
                                        href={EXACT_APK_URL} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow flex items-center justify-center space-x-1.5 min-h-[42px]"
                                    >
                                        <i className="fa-solid fa-download"></i>
                                        <span>Download Delhi GPO Android APK</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {/* FIXED BOTTOM-CENTER FLOATING APP INSTALL PILL */}
                    {showInstallPopup && (
                        <div className="fixed bottom-[calc(1rem+env(safe-area-inset-bottom))] left-1/2 -translate-x-1/2 z-[9999] max-w-[calc(100vw-1.5rem)] w-auto bg-sky-950/95 backdrop-blur-lg border-2 border-amber-400/90 text-white py-1.5 px-3 sm:px-4 rounded-full shadow-2xl animate-float-glow flex items-center space-x-2 sm:space-x-3 transition-all shrink-0">
                            <div className="w-6 h-6 sm:w-7 sm:h-7 bg-amber-400/20 border border-amber-400/50 rounded-full flex items-center justify-center shrink-0">
                                <i className="fa-solid fa-mobile-screen-button text-amber-400 text-[10px] sm:text-xs"></i>
                            </div>
                            <div className="flex flex-col pr-1 text-left min-w-0">
                                <span className="font-extrabold text-[10px] sm:text-[11px] text-amber-300 leading-tight truncate">{t('installTitle')}</span>
                                <span className="text-[8px] sm:text-[9px] text-sky-200 font-medium">Android App</span>
                            </div>
                            <a 
                                href={EXACT_APK_URL}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-full text-[10px] sm:text-[11px] shadow-md transition-all flex items-center space-x-1 shrink-0 active:scale-95 border border-amber-400/50"
                            >
                                <i className="fa-solid fa-download text-[8px] sm:text-[9px]"></i>
                                <span>{t('installBtn')}</span>
                            </a>
                            <button 
                                onClick={() => {
                                    setShowInstallPopup(false);
                                    safeSession.setItem('gpo_app_popup_dismissed', 'true');
                                }}
                                className="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-sky-900 hover:bg-sky-800 text-sky-200 hover:text-white flex items-center justify-center text-[9px] sm:text-xs transition-all shrink-0 border border-sky-700"
                                title="Close"
                            >
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
